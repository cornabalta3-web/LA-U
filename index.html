<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Urracas</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap');

:root{
  --azul: #2E6BE6;
  --azul-oscuro: #17408F;
  --azul-claro: #8FB8FF;
  --fondo: #0A0E18;
  --superficie: #141A28;
  --superficie-2: #1E2637;
  --superficie-3: #2A3348;
  --tinta: #EDF1F7;
  --tinta-suave: #97A1B2;
  --ok: #35C46B;
  --ok-bg: rgba(53,196,107,0.14);
  --pend: #F26058;
  --pend-bg: rgba(242,96,88,0.14);
  --oro: #FFC940;
  --ambar: #FF9F2A;
  --linea: rgba(237,241,247,0.10);
  --radio: 14px;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body{ margin:0; padding:0; }
body{
  background: var(--fondo);
  color: var(--tinta);
  font-family:'Work Sans', -apple-system, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  min-height:100vh;
  overscroll-behavior-y: none;
}

.app{
  max-width: 620px;
  margin: 0 auto;
  padding: 0 14px calc(96px + env(safe-area-inset-bottom));
}

/* ============ HEADER ============ */
.header{
  position: relative;
  margin: 0 -14px 16px;
  padding: calc(16px + env(safe-area-inset-top)) 16px 18px;
  background:
    radial-gradient(120% 100% at 50% 0%, #1E3F8F 0%, #0F1A33 55%, var(--fondo) 100%);
  border-bottom: 1px solid var(--linea);
}
.header-top{ display:flex; align-items:center; gap: 12px; }
.escudo{ flex-shrink:0; filter: drop-shadow(0 3px 8px rgba(0,0,0,0.5)); }
.header-txt{ flex:1; min-width:0; }
.header-txt h1{
  font-family:'Bebas Neue', sans-serif;
  font-size: clamp(26px, 8vw, 34px);
  letter-spacing: 2px;
  margin: 0;
  line-height: 1;
  color:#fff;
}
.header-txt .fecha{
  font-size: 12.5px;
  color: var(--tinta-suave);
  text-transform: capitalize;
  margin-top: 2px;
}
.perfil-chip{
  display:flex; align-items:center; gap:8px;
  margin-top: 14px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 999px;
  padding: 7px 8px 7px 14px;
  font-size: 14px;
}
.perfil-chip .nom{ font-weight:700; }
.perfil-chip .capitan{
  background: var(--oro); color:#3A2A00;
  font-family:'Bebas Neue',sans-serif; font-size: 11px; letter-spacing:.7px;
  padding: 3px 8px; border-radius: 999px;
}
.perfil-chip .salir{
  margin-left:auto;
  background: rgba(255,255,255,0.12);
  border:none; color: var(--tinta);
  font-size: 12.5px; font-weight:600;
  padding: 7px 13px; border-radius: 999px;
  min-height: 0; cursor:pointer;
}

/* ============ STATS ============ */
.stats{ display:grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 14px; }
.stat{
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 12px;
  padding: 11px 6px;
  text-align:center;
}
.stat .num{
  font-family:'JetBrains Mono', monospace;
  font-size: clamp(18px, 6vw, 23px); font-weight:700;
  color: var(--oro); display:block; line-height:1.1;
}
.stat .lbl{
  font-size: 9.5px; text-transform: uppercase; letter-spacing: .5px;
  color: var(--tinta-suave); margin-top: 3px; display:block;
}

/* ============ CARDS ============ */
.card{
  background: var(--superficie);
  border: 1px solid var(--linea);
  border-radius: var(--radio);
  padding: 16px;
  margin-bottom: 14px;
}
.card h2{
  font-family:'Bebas Neue', sans-serif;
  letter-spacing: .8px; font-size: 20px;
  margin: 0 0 4px; color: #fff;
}
.card .hint{ font-size: 13px; color: var(--tinta-suave); margin: 0 0 14px; }
.card h2 + .lista, .card h2 + .row{ margin-top: 12px; }

/* ============ CONTROLES ============ */
.row{ display:flex; gap:8px; margin-bottom: 10px; }
.row.col{ flex-direction: column; }
.row > *{ flex:1; min-width:0; }

input, select{
  font-family:'Work Sans', sans-serif;
  font-size: 16px; /* 16px evita el zoom automático en iPhone */
  padding: 13px 12px;
  border-radius: 11px;
  border: 1px solid var(--linea);
  background: var(--superficie-2);
  color: var(--tinta);
  width:100%;
  -webkit-appearance:none; appearance:none;
}
select{
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2397A1B2' stroke-width='2'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
  background-repeat:no-repeat; background-position: right 12px center; background-size: 18px;
  padding-right: 38px;
}
input::placeholder{ color: #63708A; }
input:focus, select:focus{ outline:none; border-color: var(--azul); }

button{
  font-family:'Work Sans', sans-serif;
  font-weight:700; font-size: 15px;
  padding: 13px 16px;
  border-radius: 11px; border:none;
  background: var(--azul); color:#fff;
  cursor:pointer; min-height: 48px;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
button:active{ transform: scale(0.98); }
button.ghost{ background: var(--superficie-2); color: var(--tinta); border:1px solid var(--linea); }
button.danger{ background: var(--pend-bg); color: var(--pend); border:1px solid rgba(242,96,88,0.35); }
button.mini{ min-height: 38px; padding: 8px 12px; font-size: 13px; border-radius: 9px; }
button:disabled{ opacity:.4; }
button.full{ width:100%; }

/* ============ LISTA DE JUGADORES ============ */
.lista{ list-style:none; margin:0; padding:0; }
.item{
  display:flex; align-items:center; gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid var(--linea);
}
.item:last-child{ border-bottom:none; }
.item-main{ flex:1; min-width:0; }
.item-nom{ font-weight:600; font-size: 15.5px; display:block; }
.item-sub{ font-size: 11.5px; color: var(--tinta-suave); margin-top: 2px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.yo{ color: var(--azul-claro); font-weight:700; font-size: 11.5px; }

/* Inicial con color propio de cada nombre */
.avatar{
  flex:0 0 auto; width: 36px; height: 36px; border-radius: 50%;
  display:flex; align-items:center; justify-content:center;
  font-family:'Bebas Neue', sans-serif; font-size: 18px; letter-spacing:.5px;
  background: hsl(var(--h) 45% 26%);
  color: hsl(var(--h) 85% 78%);
  border: 1.5px solid hsl(var(--h) 50% 38%);
}
.item.en-espera .avatar{ opacity:.55; }

/* Píldoras de estado */
.pill{
  font-size: 11px; font-weight:700; letter-spacing:.3px;
  padding: 4px 9px; border-radius: 999px;
  background: var(--superficie-3); color: var(--tinta-suave);
  white-space:nowrap;
}
.pill.ok{ background: var(--ok-bg); color: var(--ok); }
.pill.no{ background: var(--pend-bg); color: var(--pend); }
.pill.oro{ background: rgba(255,201,64,.16); color: var(--oro); }

/* Botón toggle de estado */
.toggle{
  font-family:'Bebas Neue', sans-serif;
  font-size: 13px; letter-spacing:.8px;
  padding: 9px 14px; border-radius: 999px;
  border: 1.5px solid var(--ok); color: var(--ok);
  background: var(--ok-bg);
  cursor:pointer; min-height: 40px; white-space:nowrap;
  display:inline-flex; align-items:center;
}
.toggle.no{ border-color: var(--pend); color: var(--pend); background: var(--pend-bg); }
.toggle.off{ opacity:.35; pointer-events:none; }

/* ============ MI RESPUESTA (destacado) ============ */
.destacado{
  background: linear-gradient(150deg, rgba(46,107,230,.18), rgba(46,107,230,.05));
  border: 1.5px solid rgba(46,107,230,.5);
  border-radius: var(--radio);
  padding: 15px;
  margin-bottom: 16px;
}
.destacado .titulo{
  font-family:'Bebas Neue',sans-serif; font-size: 17px; letter-spacing:.5px;
  color:#fff; margin-bottom: 11px;
}
.destacado .row{ margin-bottom:0; }
.pregunta{
  font-family:'Bebas Neue',sans-serif;
  font-size: 22px; letter-spacing:.6px; color:#fff;
  text-align:center; margin: 14px 0 10px;
}

/* Cuenta regresiva y barra de lugares */
.cuenta-atras{
  display:inline-block; margin: 2px 0 10px;
  font-family:'Bebas Neue',sans-serif; font-size: 15px; letter-spacing:.8px;
  color: var(--oro);
  background: rgba(255,201,64,.14); border:1px solid rgba(255,201,64,.3);
  padding: 3px 11px; border-radius: 999px;
}
.lugares{ margin-top: 12px; }
.lugares-txt{
  display:flex; justify-content:space-between;
  font-size: 11.5px; font-weight:700; color: var(--tinta-suave);
  margin-bottom: 6px; text-transform: uppercase; letter-spacing:.3px;
}
.barra{
  height: 8px; border-radius: 999px;
  background: rgba(255,255,255,.10); overflow:hidden;
}
.barra-llena{
  height:100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--azul), var(--azul-claro));
  transition: width .45s cubic-bezier(.4,0,.2,1);
}

/* Entrada suave al cambiar de pantalla */
@keyframes entrar{
  from{ opacity:0; transform: translateY(8px); }
  to{ opacity:1; transform:none; }
}
.anima > *{ animation: entrar .26s cubic-bezier(.2,.7,.3,1) both; }
.anima > *:nth-child(2){ animation-delay: .05s; }
.anima > *:nth-child(3){ animation-delay: .1s; }
.anima > *:nth-child(n+4){ animation-delay: .14s; }
.destacado button{ font-size: 16px; padding: 15px; }
.btn-si{ background: var(--ok); color:#06230F; }
.btn-si.inactivo{ background: var(--superficie-2); color: var(--tinta-suave); border:1px solid var(--linea); }
.btn-no{ background: var(--pend); color:#2B0605; }
.btn-no.inactivo{ background: var(--superficie-2); color: var(--tinta-suave); border:1px solid var(--linea); }

/* ============ EVENTOS (amistoso / asado) ============ */
.evento{
  background: var(--superficie-2);
  border: 1px solid var(--linea);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
}
.evento-cab{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom: 12px; }
.evento-tit{ font-weight:700; font-size: 16px; }
.evento-meta{ font-size: 12.5px; color: var(--tinta-suave); margin-top:2px; }

.tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top: 10px; }
.tag{
  font-size: 12.5px; font-weight:600;
  background: rgba(46,107,230,.18); color: var(--azul-claro);
  border: 1px solid rgba(46,107,230,.3);
  border-radius: 8px; padding: 6px 10px;
}
.tag.quitar{ cursor:pointer; }
.tag.quitar::after{ content:" ✕"; opacity:.6; }

.vacio{ font-size: 13.5px; color: var(--tinta-suave); padding: 12px 0; text-align:center; }
.aviso{
  font-size: 13px; background: rgba(242,96,88,.1);
  border-left: 3px solid var(--pend); color: #FFC9C6;
  padding: 10px 12px; border-radius: 8px; margin-bottom: 12px;
}
.aviso.info{ background: rgba(46,107,230,.1); border-left-color: var(--azul); color: var(--azul-claro); }

.separador{ font-size: 12px; color: var(--tinta-suave); text-transform:uppercase; letter-spacing:.6px; margin: 18px 0 8px; font-weight:700; }

/* ============ NAV INFERIOR ============ */
.nav{
  position: fixed; bottom:0; left:0; right:0;
  background: rgba(15,19,27,.94);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--linea);
  display:flex;
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  z-index: 40;
  overflow-x: auto; scrollbar-width: none;
}
.nav::-webkit-scrollbar{ display:none; }
.nav-btn{
  flex:1 1 0; min-width:0;
  background:none; border:none; padding: 9px 4px;
  display:flex; flex-direction:column; align-items:center; gap:5px;
  color: var(--tinta-suave); min-height:auto; border-radius: 13px;
  transition: color .15s, background .15s;
}
.nav-btn svg{ width:24px; height:24px; }
.nav-btn span{ font-size: 11px; font-weight:700; letter-spacing:.2px; }
.nav-btn.on{ color:#fff; background: rgba(46,107,230,.18); }
.nav-btn.on svg{ filter: drop-shadow(0 2px 6px rgba(46,107,230,.7)); }

/* Botonazos de la pantalla "Más" */
.boton-grande{
  width:100%; text-align:left;
  background: var(--superficie-2); color: var(--tinta);
  border: 1px solid var(--linea); border-radius: 13px;
  padding: 13px 14px; margin-bottom: 9px;
  display:flex; align-items:center; gap: 13px;
  min-height: 62px;
}
.boton-grande:last-child{ margin-bottom:0; }
.boton-grande .ico{
  flex:0 0 auto; width: 38px; height: 38px; border-radius: 11px;
  background: rgba(46,107,230,.16); color: var(--azul-claro);
  display:flex; align-items:center; justify-content:center;
}
.boton-grande .ico svg{ width:20px; height:20px; }
.boton-grande .txt{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.boton-grande .txt .t{ font-size: 15.5px; font-weight:700; }
.boton-grande .txt .d{ font-size: 12px; font-weight:500; color: var(--tinta-suave); }
.boton-grande .flecha{ font-size: 21px; color: var(--tinta-suave); flex:0 0 auto; }

.volver{
  background:none; border:none; color: var(--azul-claro);
  font-size: 14px; font-weight:700; padding: 4px 2px 10px;
  min-height:auto; justify-content:flex-start;
}

.sumario{
  cursor:pointer; font-size: 13.5px; font-weight:700; color: var(--azul-claro);
  padding: 8px 0; list-style:none; user-select:none;
}
.sumario::-webkit-details-marker{ display:none; }
.sumario::before{ content:"⚙ "; }

/* ============ MODAL ============ */
.overlay{
  position:fixed; inset:0; background: rgba(6,9,14,.82);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display:flex; align-items:center; justify-content:center;
  padding: 18px; z-index: 100;
}
.modal{
  background: var(--superficie);
  border:1px solid rgba(46,107,230,.35);
  border-radius: 20px; padding: 24px 20px;
  width:100%; max-width: 400px;
  max-height: 88vh; overflow-y:auto;
}
.modal .escudo-modal{ display:flex; justify-content:center; margin-bottom: 12px; }
.modal h2{
  font-family:'Bebas Neue',sans-serif; font-size: 27px; letter-spacing:1px;
  color:#fff; margin:0; text-align:center;
}
.modal .sub{ font-size: 14px; color: var(--tinta-suave); margin: 4px 0 20px; text-align:center; }
.modal label{ font-size: 13px; font-weight:700; display:block; margin-bottom: 6px; color: var(--tinta-suave); }
.campo{ margin-bottom: 14px; }
.check{
  display:flex; align-items:center; gap: 10px; margin-bottom: 14px;
  background: var(--superficie-2); padding: 12px; border-radius: 11px;
  cursor:pointer;
}
.check input{ width:20px; height:20px; flex:0 0 auto; accent-color: var(--azul); }
.check label{ margin:0; font-size: 14.5px; color: var(--tinta); font-weight:600; cursor:pointer; }
.error{ color: var(--pend); font-size: 13px; margin-bottom: 12px; display:none; background: var(--pend-bg); padding: 9px 11px; border-radius: 9px; }

.tabs-modal{ display:flex; gap:8px; margin-bottom: 18px; }
.tabs-modal button{ flex:1; font-size: 14px; }

/* ============ NAVEGADOR DE FECHAS ============ */
.nav-fechas{
  display:flex; align-items:center; gap:10px;
  background: var(--superficie); border:1px solid var(--linea);
  border-radius: 12px; padding: 8px 10px; margin-bottom: 12px;
}
.nav-fechas button{ flex:0 0 auto; min-width:42px; font-size:20px; padding:6px 10px; }
.nav-fechas-lbl{
  flex:1; text-align:center; font-weight:700; font-size: 15px;
  display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
  text-transform: capitalize;
}

/* ============ DIFERENCIACIÓN SÁBADO / AMISTOSO ============ */
.evento.amistoso{
  border-left: 4px solid var(--ambar);
  background: linear-gradient(100deg, rgba(255,159,42,.09), var(--superficie-2) 60%);
}
.destacado.amistoso-tema{
  background: linear-gradient(150deg, rgba(255,159,42,.18), rgba(255,159,42,.05));
  border-color: rgba(255,159,42,.5);
}
.etiqueta-tipo{
  display:inline-flex; align-items:center; gap:5px;
  font-family:'Bebas Neue',sans-serif; font-size: 12px; letter-spacing:.9px;
  padding: 4px 10px; border-radius: 6px; margin-bottom: 8px;
}
.etiqueta-tipo.sabado{ background: rgba(46,107,230,.22); color: var(--azul-claro); }
.etiqueta-tipo.amistoso{ background: rgba(255,159,42,.2); color: var(--ambar); }

/* ============ RESULTADOS ============ */
.resultado-box{
  display:flex; align-items:center; justify-content:center; gap: 14px;
  background: rgba(0,0,0,.28); border-radius: 11px; padding: 12px; margin-bottom: 10px;
}
.resultado-marcador{
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size: 26px;
}
.res-pill{
  font-family:'Bebas Neue',sans-serif; font-size: 14px; letter-spacing:1px;
  padding: 6px 14px; border-radius: 8px;
}
.res-pill.gano{ background: var(--ok-bg); color: var(--ok); }
.res-pill.perdio{ background: var(--pend-bg); color: var(--pend); }
.res-pill.empate{ background: var(--superficie-3); color: var(--tinta-suave); }

.mvp-box{
  display:flex; align-items:center; gap:10px;
  background: rgba(255,201,64,.12); border:1px solid rgba(255,201,64,.3);
  border-radius: 11px; padding: 11px 13px; margin-bottom: 10px;
}
.mvp-box .estrella{ font-size: 20px; }
.mvp-box .txt{ flex:1; }
.mvp-box .lbl{ font-size: 10.5px; text-transform:uppercase; letter-spacing:.6px; color: var(--tinta-suave); font-weight:700; }
.mvp-box .nom{ font-size: 16px; font-weight:700; color: var(--oro); }

/* ============ ESTADÍSTICAS ============ */
.stat-grande{
  display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin-bottom: 16px;
}
.stat-caja{
  background: var(--superficie-2); border:1px solid var(--linea);
  border-radius: 12px; padding: 14px 8px; text-align:center;
}
/* Con $120.000 en tres columnas, a 24px el número se salía de la tarjeta */
.stat-caja .n{
  font-family:'JetBrains Mono',monospace; font-size: clamp(14px, 5vw, 24px);
  font-weight:700; display:block; line-height:1.05; overflow-wrap:anywhere;
}
.stat-caja .t{ font-size: 10px; text-transform:uppercase; letter-spacing:.5px; color: var(--tinta-suave); margin-top:5px; display:block; }
.stat-caja.g .n{ color: var(--ok); }
.stat-caja.e .n{ color: var(--tinta-suave); }
.stat-caja.p .n{ color: var(--pend); }

.rank-pos{
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size: 14px;
  color: var(--tinta-suave); flex:0 0 26px;
}
.rank-pos.top{ color: var(--oro); }

/* ============ TRICOUNT ============ */
.destacado.debe-tema{
  background: linear-gradient(150deg, rgba(242,96,88,.18), rgba(242,96,88,.05));
  border-color: rgba(242,96,88,.5);
}
.mi-saldo{
  font-family:'Bebas Neue',sans-serif; font-size: 30px; letter-spacing:.8px;
  line-height:1.1; margin-bottom: 4px;
}
.mi-saldo.positivo{ color: var(--ok); }
.mi-saldo.negativo{ color: var(--pend); }
.mi-saldo.neutro{ color: var(--tinta); }
.mi-saldo-sub{ font-size: 12.5px; color: var(--tinta-suave); }

.pago-fila{
  display:flex; align-items:center; gap:8px;
  background: var(--superficie-2); border:1px solid var(--linea);
  border-radius: 11px; padding: 12px 13px; margin-bottom: 8px;
  font-size: 14px;
}
.pago-fila.mio{ border-color: rgba(242,96,88,.45); background: rgba(242,96,88,.08); }
.pago-de{ font-weight:700; }
.pago-flecha{ color: var(--tinta-suave); }
.pago-a{ font-weight:700; color: var(--ok); }
.pago-monto{
  margin-left:auto; font-family:'JetBrains Mono',monospace;
  font-weight:700; font-size: 15px; color: var(--oro);
}

.banner-conexion{
  background: var(--pend); color:#fff;

// Link de la app: se detecta solo, así sirve aunque cambie el dominio
const LINK_APP = (location.origin + location.pathname).replace(/index\.html$/,"");

function compartirWsp(texto){
  window.open("https://wa.me/?text=" + encodeURIComponent(texto), "_blank");
}
// Los teléfonos se cargan como los dice la gente (351 123 4567, con o sin 15).
// WhatsApp los quiere con país y sin el 15: 549 351 123 4567.
function telWsp(t){
  let n = String(t||"").replace(/\D/g,"");
  if(!n) return "";
  if(n.startsWith("00")) n = n.slice(2);
  while(n.startsWith("0")) n = n.slice(1);
  if(!n.startsWith("54")) n = "54" + n;
  if(!n.startsWith("549")) n = "549" + n.slice(2);
  let resto = n.slice(3);
  // Si lo cargaron con el 15 sobra un dígito: 351 15 123 4567 -> 351 123 4567
  if(resto.length > 10){
    const i = resto.indexOf("15");
    if(i >= 2 && i <= 4) resto = resto.slice(0,i) + resto.slice(i+2);
  }
  return "549" + resto;
}
// Abre el chat privado de alguien con el mensaje ya escrito. Devuelve false si
// no tiene teléfono cargado, para poder ofrecer copiar el texto.
function wspPrivado(tel, texto){
  const n = telWsp(tel);
  if(!n) return false;
  window.open("https://wa.me/" + n + "?text=" + encodeURIComponent(texto), "_blank");
  return true;
}
async function copiar(texto){
  try{
    await navigator.clipboard.writeText(texto);
    return true;
  }catch(e){
    // Safari viejo y http:// no tienen clipboard: probamos a la antigua.
    try{
      const ta = document.createElement("textarea");
      ta.value = texto;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      ta.remove();
      return ok;
    }catch(e2){ return false; }
  }
}
function pieInvitacion(accion){

}

// El molde vacío. Cada snapshot arranca de acá, así lo que se borró en la base
// desaparece en serio en vez de quedar vivo en este celu.
function estadoVacio(){
  return {
    jugadores: [], admins: [],
    fechaCuotaActual: null, fechasCuota: [],
    cuota: {}, sabados: {}, sabadoNo: {}, sabadoConfig: {}, amistosos: [], asados: [],
    montoCuota: "", alias: "", gastos: [], tricount: []
  };
}
let data = estadoVacio();
let miPerfil = null;

function uid(){ return Math.random().toString(36).slice(2,9); }
// Para comparar nombres sin que "José" y "jose" sean dos personas distintas.
function sinAdornos(s){
  return (s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
// OJO: toISOString() da la fecha en UTC, y Argentina va 3 horas atrás. Un sábado
// a las 21:30 el UTC ya es domingo, así que usar toISOString para fechas del
// calendario corre todo un día a partir de las 21. Se arma a mano.
function isoLocal(d){
  return d.getFullYear() + "-" +
    String(d.getMonth()+1).padStart(2,"0") + "-" +
    String(d.getDate()).padStart(2,"0");
}
function hoyISO(){ return isoLocal(new Date()); }
function proximoSabado(){
  const d = new Date();
  const diff = (6 - d.getDay() + 7) % 7 || 7;
  const s = new Date(d);
  s.setDate(d.getDate() + (d.getDay()===6 ? 0 : diff));
  return isoLocal(s);
}
// Cuántos días faltan, en criollo: "Faltan 3 días", "Mañana", "¡Es hoy!"
function diasPara(fecha){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const d = new Date(fecha + "T12:00:00"); d.setHours(0,0,0,0);
  return Math.round((d - hoy) / 86400000);
}
function textoCuandoFalta(fecha){
  const n = diasPara(fecha);
  if(n === 0) return "¡Es hoy!";
  if(n === 1) return "Es mañana";
  if(n < 0) return n === -1 ? "Fue ayer" : "Ya se jugó";
  if(n < 7) return "Faltan " + n + " días";
  return "Falta más de una semana";
}
// Inicial de colorcito para las listas: el mismo nombre siempre da el mismo color.
function inicialDe(nombre){ return (nombre||"?").trim().charAt(0).toUpperCase(); }
function tonoDe(nombre){
  let h = 0;
  for(let i=0; i<(nombre||"").length; i++) h = (h*31 + nombre.charCodeAt(i)) % 360;
  return h;
}
function avatar(nombre){
  return `<span class="avatar" style="--h:${tonoDe(nombre)}">${inicialDe(nombre)}</span>`;
}
function fechaLinda(iso){
  if(!iso) return "";
  const [a,m,d] = iso.split("-");
  return `${d}/${m}`;
}
function nombreDe(id){
  const j = data.jugadores.find(x=>x.id===id);
  return j ? j.nombre : "(?)";
}
function esAdmin(id){ return data.admins.includes(id); }
function soyCapitan(){ return miPerfil && esAdmin(miPerfil.id); }
function fechaCuotaVigente(){
  return data.fechasCuota.length ? data.fechasCuota[data.fechasCuota.length-1] : null;
}
// ---------- FECHAS DE CUOTA (un mes cada una) ----------
// Las fechas son meses: el id es "2026-09". Se abren solas, nadie tiene que
// acordarse de crear la siguiente. Las viejas (ids random, de antes de esto)
// siguen andando y se muestran como "Fecha 1", "Fecha 2"...
// Si algún día cobran por semana en vez de por mes, se cambia `periodoActual()`.
const MESES = ["enero","febrero","marzo","abril","mayo","junio",
               "julio","agosto","septiembre","octubre","noviembre","diciembre"];
// Se cobra por fecha: una cuota por sábado. El id de la fecha ES el día del
// partido ("2026-09-12"), así "la cuota de esta fecha" significa siempre lo mismo.
function periodoActual(){ return proximoSabado(); }
function esPeriodo(id){ return /^\d{4}-\d{2}(-\d{2})?$/.test(id||""); }
function etiquetaFecha(id){
  if(/^\d{4}-\d{2}-\d{2}$/.test(id||"")){
    // No le digas "sábado" a una fecha suelta que cayó otro día.
    return (new Date(id + "T12:00:00").getDay() === 6 ? "sábado " : "fecha del ") + fechaLinda(id);
  }
  if(/^\d{4}-\d{2}$/.test(id||"")){
    // Quedó alguna fecha mensual de la versión anterior.
    const [a,m] = id.split("-");
    const nombre = MESES[Number(m)-1] || "?";
    const txt = nombre.charAt(0).toUpperCase() + nombre.slice(1);
    return Number(a) === new Date().getFullYear() ? txt : txt + " " + a;
  }
  const i = data.fechasCuota.indexOf(id);
  return i >= 0 ? "Fecha " + (i+1) : "Fecha ?";
}
// Abre el mes en curso si todavía no existe. Es idempotente: lo puede llamar
// cualquiera desde cualquier celu y el resultado es el mismo.
async function abrirPeriodoSiHaceFalta(){
  const p = periodoActual();
  if(data.fechasCuota.includes(p)) return false;
  data.fechasCuota.push(p);
  await guardarRama("fechasCuota", data.fechasCuota);
  return true;
}
// La fecha que se está MIRANDO en la pestaña Cuota. Es de cada uno: mirar una
// fecha vieja ya no se la cambia al resto (antes se guardaba en la base).
let fechaVista = null;
function fechaCuotaVista(){
  if(!fechaVista || !data.fechasCuota.includes(fechaVista)) fechaVista = fechaCuotaVigente();
  return fechaVista;
}
function estadoCuota(fecha, pid){
  if(!fecha) return {declarado:false, confirmado:false};
  if(!data.cuota[fecha]) data.cuota[fecha] = {};
  const a = data.cuota[fecha][pid];
  if(!a || typeof a !== "object") data.cuota[fecha][pid] = {declarado:false, confirmado:false};
  return data.cuota[fecha][pid];
}
function partidosJugados(pid){
  return Object.values(data.sabados||{}).filter(a=>Array.isArray(a)&&a.includes(pid)).length;
}
// Exentos: los que son del grupo pero no pagan cuota (no juegan, van a ver, etc.).
// Lo marca un capitán desde la pestaña Plantel.
function esExento(pid){
  const j = data.jugadores.find(x=>x.id===pid);
  return !!(j && j.exento);
}
// ¿Pagó la fecha de esta semana? (para el contador de arriba, no para la deuda)
function pagoLaFecha(pid){
  if(esExento(pid)) return true;
  const f = fechaCuotaVigente();
  return f ? estadoCuota(f, pid).confirmado : false;
}

// Fechas de cuota que alguien todavía no tiene confirmadas. Se cuenta desde que
// entró al plantel (`desde`); a los que ya estaban antes de esto se les cuenta
// desde la primera fecha, que es lo mismo que venía pasando.
function fechasQueDebe(pid){
  if(esExento(pid)) return [];
  const j = data.jugadores.find(x=>x.id===pid);
  const desde = Math.max(0, data.fechasCuota.indexOf(j && j.desde));
  // La cuota se cobra POR FECHA y la paga TODO EL MUNDO, juegue o no: la cancha
  // se paga igual. El único que no paga es el exento.
  return data.fechasCuota.slice(desde).filter(f=>!estadoCuota(f, pid).confirmado);
}
// Al día = no debe ninguna fecha vencida.
function cuotaAlDia(pid){ return fechasQueDebe(pid).length === 0; }
function deudaDe(pid){
  return fechasQueDebe(pid).length * (Number(data.montoCuota) || 0);
}

  const n = fechasQueDebe(j.id).length;
  const monto = deudaDe(j.id);

}

let sabadoVisto = null;

function sabadosConHistorial(){

// ---------- CONFIG DEL PARTIDO DEL SÁBADO ----------
const LUGARES = ["Tribunales", "Taborín", "Otro"];
const CUPO_INTERNO = 14;

function configSabado(fecha){
  if(!data.sabadoConfig[fecha] || typeof data.sabadoConfig[fecha] !== "object"){
    data.sabadoConfig[fecha] = { hora:"", lugar:"Tribunales", lugarOtro:"", modo:"interno", rival:"" };
  }
  const c = data.sabadoConfig[fecha];
  if(!c.lugar) c.lugar = "Tribunales";
  if(!c.modo) c.modo = "interno";
  if(c.hora === undefined) c.hora = "";
  if(c.lugarOtro === undefined) c.lugarOtro = "";
  if(c.rival === undefined) c.rival = "";
  return c;
}
function textoLugar(c){
  return c.lugar === "Otro" ? (c.lugarOtro || "A confirmar") : c.lugar;
}
function textoModo(c){

}

// ---------- RESULTADOS Y MVP ----------
function normalizarResultado(o){
  if(o.resultado === undefined) o.resultado = "";   // "gano" | "perdio" | "empate" | ""
  if(o.golesF === undefined) o.golesF = "";
  if(o.golesC === undefined) o.golesC = "";
  if(o.mvp === undefined) o.mvp = "";
  if(!o.votosMvp || typeof o.votosMvp !== "object") o.votosMvp = {};
  if(!Array.isArray(o.goleadores)) o.goleadores = []; // [{jugadorId, goles}]
  // Si cargaron el marcador pero se olvidaron de marcar si se ganó, lo deducimos.
  // Sin esto el partido queda invisible: no entra en el historial ni en el balance.
  if(!o.resultado && o.golesF !== "" && o.golesC !== "" && o.golesF != null && o.golesC != null){
    const f = Number(o.golesF), c = Number(o.golesC);
    if(!isNaN(f) && !isNaN(c)) o.resultado = f > c ? "gano" : (f < c ? "perdio" : "empate");
  }
  return o;
}

// ¿Ya pasó el partido + 90 min y falta cargar el resultado?
function partidoTerminado(fecha, hora){
  if(!fecha) return false;
  const h = hora && /^\d{2}:\d{2}$/.test(hora) ? hora : "20:00";
  const inicio = new Date(fecha + "T" + h + ":00");
  if(isNaN(inicio.getTime())) return false;
  return Date.now() >= inicio.getTime() + 90*60*1000;
}
function golesDe(pid){
  let n = 0;
  Object.keys(data.sabadoConfig||{}).forEach(f=>{
    const c = data.sabadoConfig[f];
    if(c && Array.isArray(c.goleadores)){
      c.goleadores.forEach(g=>{ if(g.jugadorId===pid) n += Number(g.goles)||0; });
    }
  });
  (data.amistosos||[]).forEach(a=>{
    if(Array.isArray(a.goleadores)) a.goleadores.forEach(g=>{ if(g.jugadorId===pid) n += Number(g.goles)||0; });
  });
  return n;
}

// ---------- VOTACIÓN DE LA FIGURA ----------
function ganadorMvp(obj){
  const votos = (obj && obj.votosMvp) || {};
  const conteo = {};
  Object.values(votos).forEach(v=>{ if(v) conteo[v] = (conteo[v]||0)+1; });
  let mejor = null, max = 0, empate = false;
  Object.keys(conteo).forEach(id=>{
    if(conteo[id] > max){ max = conteo[id]; mejor = id; empate = false; }
    else if(conteo[id] === max){ empate = true; }
  });
  if(!mejor) return null;
  return { id: mejor, votos: max, total: Object.keys(votos).length, empate };
}
function mvpsDe(pid){
  let n = 0;
  Object.keys(data.sabadoConfig||{}).forEach(f=>{
    const g = ganadorMvp(data.sabadoConfig[f]);
    if(g && g.id === pid) n++;
  });
  (data.amistosos||[]).forEach(a=>{
    const g = ganadorMvp(a);
    if(g && g.id === pid) n++;
  });
  return n;
}

// ---------- LISTA DE ESPERA ----------
// Los primeros `cupo` de la lista son titulares; el resto queda en espera
// y asciende solo cuando alguien se baja.
function separarCupo(lista, cupo){
  if(cupo === null) return { titulares: lista.slice(), espera: [] };
  return { titulares: lista.slice(0, cupo), espera: lista.slice(cupo) };
}

// ---------- ARMADO DE EQUIPOS ----------
function armarEquipos(ids){
  // Reparte alternando por presentismo para que queden parejos
  const orden = ids.slice().sort((a,b)=>presenciasTotales(b)-presenciasTotales(a));
  const A = [], B = [];
  orden.forEach((id,i)=>{
    // patrón serpenteante: A,B,B,A,A,B,B,A...
    const bloque = Math.floor(i/2) % 2;
    if((i%2===0) === (bloque===0)) A.push(id); else B.push(id);
  });
  return { a:A, b:B };
}

// ---------- CAJA ----------
function totalRecaudado(){
  const monto = Number(data.montoCuota) || 0;
  if(!monto) return 0;
  let pagos = 0;
  Object.keys(data.cuota||{}).forEach(f=>{
    Object.values(data.cuota[f]||{}).forEach(e=>{ if(e && e.confirmado) pagos++; });
  });
  return pagos * monto;
}
function totalGastos(){
  return (data.gastos||[]).reduce((s,g)=>s + (Number(g.monto)||0), 0);
}
function plata(n){
  return "$" + (Number(n)||0).toLocaleString('es-AR');
}

// ---------- TRICOUNT: BALANCES Y LIQUIDACIÓN ----------
// Por cada gasto: el que pagó suma el total, y cada participante
// resta la parte que le toca.
function balancesTricount(gastos){
  const bal = {};
  (gastos||[]).forEach(g=>{
    const monto = Number(g.monto)||0;
    const parts = (g.participantes||[]).filter(id=>data.jugadores.find(j=>j.id===id));
    if(!monto || !parts.length || !g.pagadorId) return;
    bal[g.pagadorId] = (bal[g.pagadorId]||0) + monto;
    const cuotaParte = monto / parts.length;
    parts.forEach(id=>{ bal[id] = (bal[id]||0) - cuotaParte; });
  });
  return bal; // positivo = le deben; negativo = debe
}

// Calcula la menor cantidad de transferencias para saldar todo
function liquidar(bal){
  const acreedores = [], deudores = [];
  Object.keys(bal).forEach(id=>{
    const v = Math.round(bal[id]*100)/100;
    if(v > 0.5) acreedores.push({id, monto:v});
    else if(v < -0.5) deudores.push({id, monto:-v});
  });
  acreedores.sort((a,b)=>b.monto-a.monto);
  deudores.sort((a,b)=>b.monto-a.monto);
  const pagos = [];
  let i=0, j=0;
  while(i < deudores.length && j < acreedores.length){
    const monto = Math.min(deudores[i].monto, acreedores[j].monto);
    pagos.push({ de: deudores[i].id, a: acreedores[j].id, monto: Math.round(monto) });
    deudores[i].monto -= monto;
    acreedores[j].monto -= monto;
    if(deudores[i].monto < 0.5) i++;
    if(acreedores[j].monto < 0.5) j++;
  }
  return pagos;
}
function totalTricount(gastos){
  return (gastos||[]).reduce((s,g)=>s + (Number(g.monto)||0), 0);
}

// ---------- RACHAS Y RÉCORDS ----------
function rachaActual(){
  const p = todosLosPartidos(); // ya viene ordenado del más nuevo al más viejo
  if(!p.length) return null;
  const tipo = p[0].cfg.resultado;
  let n = 0;
  for(const x of p){ if(x.cfg.resultado === tipo) n++; else break; }
  return { tipo, n };
}
function rachaAsistencia(pid){
  // Cuántas convocatorias seguidas (de la más reciente hacia atrás) estuvo
  const fechas = Object.keys(data.sabados||{})
    .filter(f=>Array.isArray(data.sabados[f]) && data.sabados[f].length)
    .sort().reverse();
  let n = 0;
  for(const f of fechas){ if(data.sabados[f].includes(pid)) n++; else break; }
  return n;
}
function etiquetaResultado(r){
  return r==="gano" ? "GANAMOS" : r==="perdio" ? "PERDIMOS" : r==="empate" ? "EMPATAMOS" : "";
}
function claseResultado(r){
  return r==="gano" ? "gano" : r==="perdio" ? "perdio" : "empate";
}

// Devuelve todos los partidos con resultado cargado (sábados + amistosos)
function todosLosPartidos(){
  const out = [];
  Object.keys(data.sabadoConfig||{}).forEach(f=>{
    const c = normalizarResultado(configSabado(f));
    if(c.resultado) out.push({tipo:"sabado", fecha:f, cfg:c, plantel:(data.sabados[f]||[])});
  });
  (data.amistosos||[]).forEach(am=>{
    const a = normalizarResultado(am);
    if(a.resultado) out.push({tipo:"amistoso", fecha:am.fecha, cfg:a, plantel:(am.anotados||[])});
  });
  return out.sort((a,b)=>b.fecha.localeCompare(a.fecha));
}
function balanceEquipo(){
  const p = todosLosPartidos();
  return {
    g: p.filter(x=>x.cfg.resultado==="gano").length,
    e: p.filter(x=>x.cfg.resultado==="empate").length,
    p: p.filter(x=>x.cfg.resultado==="perdio").length,
    total: p.length
  };
}
function presenciasTotales(pid){
  let n = Object.values(data.sabados||{}).filter(a=>Array.isArray(a)&&a.includes(pid)).length;
  n += (data.amistosos||[]).filter(a=>Array.isArray(a.anotados)&&a.anotados.includes(pid)).length;
  return n;
}
// ---------- LO IMPORTANTE: lo que cada uno tiene pendiente ----------
function haceDias(n){
  const d = new Date();
  d.setDate(d.getDate() - n);
  return isoLocal(d);
}
// Sábado más reciente (de las últimas 2 semanas) que ya terminó, en el que jugó
// y todavía no votó la figura. Con el límite no queda cargoseando para siempre.
function sabadoSinVotar(pid){
  const limite = haceDias(14);
  const fechas = Object.keys(data.sabados||{})
    .filter(f=>Array.isArray(data.sabados[f]) && data.sabados[f].includes(pid))
    .sort().reverse();
  for(const f of fechas){
    if(f < limite) break;
    const c = configSabado(f);
    if(partidoTerminado(f, c.hora) && data.sabados[f].length > 1 && !(c.votosMvp||{})[pid]) return f;
  }
  return null;
}
function sabadoSinResultado(){
  const limite = haceDias(14);
  const fechas = Object.keys(data.sabados||{})
    .filter(f=>Array.isArray(data.sabados[f]) && data.sabados[f].length)
    .sort().reverse();
  for(const f of fechas){
    if(f < limite) break;
    const c = configSabado(f);
    if(partidoTerminado(f, c.hora) && !c.resultado) return f;
  }
  return null;
}
function pendientesMios(){
  const out = [];
  const sab = proximoSabado();

  const debe = fechasQueDebe(miPerfil.id);
  if(debe.length){
    const monto = deudaDe(miPerfil.id);
    out.push({
      txt: debe.length === 1
        ? "Te falta pagar la cuota: " + etiquetaFecha(debe[0])
        : `Debés ${debe.length} fechas de cuota` + (monto ? " — " + plata(monto) : ""),
      tab:"cuota", urgente:true
    });
  }
  if(!dijoSiJuega(sab, miPerfil.id)){
    out.push({ txt:`No dijiste si jugás el sábado ${fechaLinda(sab)}`, tab:"sabado", fecha:sab, urgente:true });
  }
  const votar = sabadoSinVotar(miPerfil.id);
  if(votar) out.push({ txt:`Votá la figura del partido del ${fechaLinda(votar)}`, tab:"sabado", fecha:votar });

  if(soyCapitan()){
    const fa = fechaCuotaVigente();
    const porConfirmar = data.jugadores.filter(j=>
      !j.exento && estadoCuota(fa,j.id).declarado && !estadoCuota(fa,j.id).confirmado);
    if(porConfirmar.length){
      out.push({ txt: porConfirmar.length === 1
        ? `${porConfirmar[0].nombre} dice que pagó: falta que lo confirmes`
        : `${porConfirmar.length} dicen que pagaron: falta que los confirmes`, tab:"cuota" });
    }
    const sinRes = sabadoSinResultado();
    if(sinRes) out.push({ txt:`Falta cargar el resultado del ${fechaLinda(sinRes)}`, tab:"sabado", fecha:sinRes });
    // Nadie encontraba dónde se cargaban: estaban al fondo de Cuota, debajo de
    // la lista entera. Ahora se piden desde acá arriba.
    if(!(Number(data.montoCuota) > 0)){
      out.push({ txt:"Falta cargar cuánto sale la cuota", tab:"cuota", urgente:true });
    }
    if(!data.alias){
      out.push({ txt:"Falta cargar el alias para que te transfieran", tab:"cuota" });
    }
  }
  return out;
}
function bloqueImportante(){
  const items = pendientesMios();
  const card = document.createElement("div");
  card.className = "card importante";
  card.innerHTML = `<h2>Lo importante</h2>`;
  if(!items.length){
    const ok = document.createElement("div");
    ok.className = "al-dia";
    ok.textContent = "✅ Estás al día, no tenés nada pendiente.";
    card.appendChild(ok);
    return card;

  items.forEach(it=>{

// Construye el bloque de resultado + MVP para un partido (sábado o amistoso)
// `rutaVotos` es la ramita donde viven los votos de este partido. Se guarda solo
// el voto propio, porque después del partido votan todos casi al mismo tiempo.
function bloqueResultado(obj, plantel, onGuardar, fechaPartido, horaPartido, rutaVotos){
  const cont = document.createElement("div");
  normalizarResultado(obj);

  if(obj.resultado){
    const box = document.createElement("div");
    box.className = "resultado-box";
    box.innerHTML = `<span class="res-pill ${claseResultado(obj.resultado)}">${etiquetaResultado(obj.resultado)}</span>` +
      ((obj.golesF!=="" && obj.golesC!=="") ? `<span class="resultado-marcador">${obj.golesF} - ${obj.golesC}</span>` : "");
    cont.appendChild(box);
  }
  const gan = ganadorMvp(obj);
  const puedeVotar = partidoTerminado(fechaPartido, horaPartido) &&
                     plantel.includes(miPerfil.id) && plantel.length > 1;
  const miVoto = (obj.votosMvp || {})[miPerfil.id] || "";

  if(gan){
    const m = document.createElement("div");
    m.className = "mvp-box";
    m.innerHTML = `<span class="estrella">⭐</span>
      <div class="txt">
        <div class="lbl">Figura del partido${gan.empate?" (empate)":""}</div>
        <div class="nom">${nombreDe(gan.id)}</div>
      </div>
      <span class="pill oro">${gan.votos}/${gan.total} votos</span>`;
    cont.appendChild(m);
  }

  // Votación abierta
  if(puedeVotar){
    const vot = document.createElement("div");
    vot.className = "votacion";
    vot.innerHTML = `<div class="lbl">⭐ ¿Quién fue la figura?</div>`;
    const grid = document.createElement("div");
    grid.className = "voto-grid";
    plantel.filter(id=>id!==miPerfil.id).forEach(id=>{
      const b = document.createElement("button");
      b.className = "voto-btn" + (miVoto===id ? " elegido" : "");
      b.textContent = nombreDe(id);
      b.onclick = async ()=>{
        if(!obj.votosMvp) obj.votosMvp = {};
        const saco = obj.votosMvp[miPerfil.id] === id;
        if(saco) delete obj.votosMvp[miPerfil.id];
        else obj.votosMvp[miPerfil.id] = id;
        if(rutaVotos){
          // Guardamos solo mi voto, no el árbol entero.
          await guardarRama(rutaVotos + "/" + miPerfil.id, saco ? null : id);
          render();
        } else {
          await onGuardar();
        }
      };
      grid.appendChild(b);
    });
    vot.appendChild(grid);
    if(miVoto){
      const p = document.createElement("div");
      p.className = "voto-hecho";
      p.textContent = `Votaste a ${nombreDe(miVoto)}. Tocá de nuevo para cambiar.`;
      vot.appendChild(p);
    }
    cont.appendChild(vot);
  }

  if(obj.goleadores.length){
    const g = document.createElement("div");
    g.className = "goleadores-box";
    g.innerHTML = `<div class="lbl">⚽ Goles</div>` +
      `<div class="tags">${obj.goleadores.map(x=>`<span class="tag">${nombreDe(x.jugadorId)}${Number(x.goles)>1?" ×"+x.goles:""}</span>`).join("")}</div>`;
    cont.appendChild(g);
  }

  if(soyCapitan()){
    const det = document.createElement("details");
    const pendiente = !obj.resultado && partidoTerminado(fechaPartido, horaPartido);
    if(pendiente) det.open = true;
    det.style.marginTop = "6px";
    if(pendiente){
      const rec = document.createElement("div");
      rec.className = "recordatorio";
      rec.innerHTML = `<span class="ping"></span><div>El partido ya terminó. <b>Cargá el resultado y los goles.</b></div>`;
      cont.insertBefore(rec, cont.firstChild);
    }
    det.innerHTML = `<summary class="sumario">${obj.resultado ? "Editar resultado" : "Cargar resultado y goles"}</summary>`;
    const cuerpo = document.createElement("div");
    cuerpo.style.paddingTop = "10px";

    const rR = document.createElement("div"); rR.className="row";
    const selR = document.createElement("select");
    selR.innerHTML = `
      <option value="">Se calcula con el marcador</option>
      <option value="gano"${obj.resultado==="gano"?" selected":""}>Ganamos</option>
      <option value="empate"${obj.resultado==="empate"?" selected":""}>Empatamos</option>
      <option value="perdio"${obj.resultado==="perdio"?" selected":""}>Perdimos</option>`;
    rR.appendChild(selR);
    cuerpo.appendChild(rR);

    const rG = document.createElement("div"); rG.className="row";
    const inF = document.createElement("input");
    inF.type="number"; inF.inputMode="numeric"; inF.placeholder="Nuestros"; inF.value = obj.golesF;
    const inC = document.createElement("input");
    inC.type="number"; inC.inputMode="numeric"; inC.placeholder="De ellos"; inC.value = obj.golesC;
    rG.appendChild(inF); rG.appendChild(inC);
    cuerpo.appendChild(rG);

    // El desplegable se acomoda solo mientras escriben el marcador, para que no
    // quede en "Sin cargar" y el partido termine sin contar.
    const sincronizarResultado = ()=>{
      if(inF.value === "" || inC.value === "") return;
      const f = Number(inF.value), c = Number(inC.value);
      if(isNaN(f) || isNaN(c)) return;
      selR.value = f > c ? "gano" : (f < c ? "perdio" : "empate");
    };
    inF.oninput = sincronizarResultado;
    inC.oninput = sincronizarResultado;

    const lista = plantel.length ? plantel : data.jugadores.map(j=>j.id);

    // ---- Goleadores ----
    const sepG = document.createElement("div");
    sepG.className = "separador";
    sepG.textContent = "⚽ Goleadores";
    cuerpo.appendChild(sepG);

    const listaG = document.createElement("div");
    listaG.className = "tags";
    const pintarGoleadores = ()=>{
      listaG.innerHTML = "";
      if(!obj.goleadores.length){
        listaG.innerHTML = `<span class="vacio" style="padding:4px 0;">Nadie cargado.</span>`;
      }
      obj.goleadores.forEach((g,i)=>{
        const t = document.createElement("span");
        t.className = "tag quitar";
        t.textContent = nombreDe(g.jugadorId) + (Number(g.goles)>1 ? " ×"+g.goles : "");
        t.onclick = ()=>{ obj.goleadores.splice(i,1); pintarGoleadores(); };
        listaG.appendChild(t);
      });
    };
    pintarGoleadores();
    cuerpo.appendChild(listaG);

    const rG2 = document.createElement("div"); rG2.className="row"; rG2.style.marginTop="8px";
    const selG = document.createElement("select");
    selG.innerHTML = `<option value="">Quién hizo gol...</option>` +
      lista.map(id=>`<option value="${id}">${nombreDe(id)}</option>`).join("");
    const inCant = document.createElement("input");
    inCant.type="number"; inCant.inputMode="numeric"; inCant.min="1"; inCant.value="1";
    inCant.style.flex="0 0 70px";
    const bAddG = document.createElement("button");
    bAddG.className="ghost mini"; bAddG.textContent="+"; bAddG.style.flex="0 0 auto";
    bAddG.onclick = ()=>{
      if(!selG.value) return;
      const cant = Math.max(1, Number(inCant.value)||1);
      const ya = obj.goleadores.find(x=>x.jugadorId===selG.value);
      if(ya) ya.goles = (Number(ya.goles)||0) + cant;
      else obj.goleadores.push({jugadorId:selG.value, goles:cant});
      selG.value=""; inCant.value="1";
      pintarGoleadores();
    };
    rG2.appendChild(selG); rG2.appendChild(inCant); rG2.appendChild(bAddG);
    cuerpo.appendChild(rG2);

    const bG = document.createElement("button");
    bG.className="full"; bG.textContent="Guardar resultado";
    bG.onclick = async ()=>{
      obj.resultado = selR.value;
      obj.golesF = inF.value;
      obj.golesC = inC.value;
      // Con el marcador alcanza: si no tocaron el desplegable, se deduce solo.
      normalizarResultado(obj);
      await onGuardar();
    };
    cuerpo.appendChild(bG);
    det.appendChild(cuerpo);
    cont.appendChild(det);
  }
  return cont;
}

// ¿Llegó alguna vez un snapshot? Si no, `data` es el molde vacío y escribirlo
// BORRARÍA la base del equipo entero. Pasa cuando Firebase no contesta y la app
// arranca igual con la pantalla de emergencia: ahí todo tiene que ser de lectura.
let hayDatos = false;
function sePuedeGuardar(){
  if(hayDatos) return true;
  mostrarBannerConexion("todavía no cargaron los datos del equipo");
  alert("Todavía no se pudo conectar con la base del equipo.\n\nPara no borrar nada, no se guardan cambios hasta que cargue. Fijate el internet y volvé a entrar.");
  return false;
}

async function guardar(){
  if(!sePuedeGuardar()) return;
  try{ await equipoRef.set(data); }
  catch(e){ console.error("Error guardando en Firebase:", e); }
}

// Guarda UNA ramita del árbol en vez de todo. Se usa donde varios pueden estar
// tocando la app al mismo tiempo: así uno no le pisa lo que acaba de hacer al otro.
async function guardarRama(ruta, valor){
  if(!sePuedeGuardar()) return;
  try{ await equipoRef.child(ruta).set(valor); }
  catch(e){ console.error("Error guardando " + ruta + ":", e); }
}

// Firebase a veces devuelve las listas como objeto {0:"x",1:"y"} en vez de array.
// Sin esto, una lista así se leería como vacía y borraríamos a todos los anotados.
function comoLista(v){
  if(Array.isArray(v)) return v.slice();
  if(v && typeof v === "object") return Object.keys(v).map(k=>v[k]).filter(x=>x != null);
  return [];
}

// Mete o saca a alguien de una lista compartida (los que juegan y los que no).
function enLista(arr, id, meter){
  const i = arr.indexOf(id);
  if(meter && i < 0) arr.push(id);
  if(!meter && i >= 0) arr.splice(i, 1);
  return arr;
}

// La lista del sábado la tocan todos el mismo día y a la misma hora. Se guarda
// con transacción: si alguien se adelantó, Firebase reintenta sobre el valor
// nuevo en vez de pisarlo, así no se pierde ninguna anotación.
async function cambiarAnotado(sab, pid, entrar){
  if(!sePuedeGuardar()) return;
  if(!Array.isArray(data.sabados[sab])) data.sabados[sab] = [];
  if(!Array.isArray(data.sabadoNo[sab])) data.sabadoNo[sab] = [];
  // Lo mostramos al toque y después lo confirmamos contra el servidor.
  enLista(data.sabados[sab], pid, entrar);
  enLista(data.sabadoNo[sab], pid, !entrar);
  const tx = (ruta, meter)=>{
    try{
      return equipoRef.child(ruta).transaction(actual=>
        enLista(comoLista(actual), pid, meter));
    }catch(e){ console.error("Error guardando " + ruta + ":", e); }
  };
  try{
    await Promise.all([ tx("sabados/" + sab, entrar), tx("sabadoNo/" + sab, !entrar) ]);
  }catch(e){ console.error("Error anotando:", e); }
}
function sanitizar(){
  // Firebase elimina arrays/objetos vacíos: hay que reponerlos al leer.
  if(!Array.isArray(data.jugadores)) data.jugadores = [];
  data.jugadores.forEach(j=>{
    j.exento = !!j.exento;
    if(typeof j.tel !== "string") j.tel = "";
  });
  if(!Array.isArray(data.admins)) data.admins = [];
  if(!Array.isArray(data.fechasCuota)) data.fechasCuota = [];
  if(!data.cuota || typeof data.cuota!=="object") data.cuota = {};
  if(!data.sabados || typeof data.sabados!=="object") data.sabados = {};
  if(!data.sabadoNo || typeof data.sabadoNo!=="object") data.sabadoNo = {};
  if(!data.sabadoConfig || typeof data.sabadoConfig!=="object") data.sabadoConfig = {};
  Object.values(data.sabadoConfig).forEach(c=>{
    if(c && typeof c==="object" && !Array.isArray(c.goleadores)) c.goleadores = [];
  });
  if(!Array.isArray(data.amistosos)) data.amistosos = [];
  data.amistosos.forEach(a=>{
    if(!Array.isArray(a.anotados)) a.anotados = [];
    if(!Array.isArray(a.goleadores)) a.goleadores = [];
  });
  if(!Array.isArray(data.asados)) data.asados = [];
  data.asados.forEach(a=>{ if(!Array.isArray(a.aportes)) a.aportes = []; });
  if(!Array.isArray(data.gastos)) data.gastos = [];
  if(!Array.isArray(data.tricount)) data.tricount = [];
  data.tricount.forEach(g=>{ if(!Array.isArray(g.participantes)) g.participantes = []; });
  if(data.montoCuota === undefined || data.montoCuota === null) data.montoCuota = "";
  if(typeof data.alias !== "string") data.alias = "";
}
function arrancar(){
  cargarPersonal();

  // Si Firebase no responde en 6 segundos, arrancamos igual con lo que haya
  // para que la pantalla nunca quede vacía.
  let respondio = false;
  setTimeout(()=>{
    if(!respondio){
      console.warn("Firebase no respondió a tiempo; arrancando sin conexión.");
      sanitizar();
      if(!data.fechasCuota.length) data.fechasCuota.push(periodoActual());
      mostrarBannerConexion();
      if(!miPerfil) mostrarModal(); else render();
    }
  }, 6000);

  equipoRef.on("value", snap=>{
    respondio = true;
    hayDatos = true;
    quitarBannerConexion();
    const v = snap.val();
    // Se REEMPLAZA, no se mezcla: con Object.assign una clave que alguien borró
    // seguía viva acá y volvía a la base en el próximo guardado.
    data = Object.assign(estadoVacio(), v || {});
    sanitizar();
    if(!data.fechasCuota.length){ data.fechasCuota.push(periodoActual()); }
    abrirPeriodoSiHaceFalta();
    // Si mi perfil ya no existe en el plantel, pido volver a identificarse
    if(miPerfil && !data.jugadores.find(j=>j.id===miPerfil.id)){
      miPerfil = null;
      try{ localStorage.removeItem(PERSONAL_KEY); }catch(e){}
    }
    if(!miPerfil){
      // Si ya está el modal abierto no lo rehacemos: le borraría el nombre que
      // estaba eligiendo cada vez que otro toca algo.
      if(!document.getElementById("modal-root").children.length) mostrarModal();
      return;
    }
    // Si está escribiendo (cargando el resultado, el monto, un gasto), no le
    // barremos el formulario de abajo del dedo por un cambio de otro celu.
    const foco = document.activeElement;
    if(foco && /^(INPUT|SELECT|TEXTAREA)$/.test(foco.tagName)) return;
    // No barremos el cartel de novedades si lo está leyendo justo ahora.
    if(!mostrandoNovedades) document.getElementById("modal-root").innerHTML="";
    render();
  }, err=>{
    respondio = true;
    console.error("Error leyendo Firebase:", err);
    sanitizar();
    if(!data.fechasCuota.length) data.fechasCuota.push(periodoActual());
    mostrarBannerConexion(err && err.message ? err.message : "sin acceso a la base");
    if(!miPerfil) mostrarModal(); else render();
  });
}

function mostrarBannerConexion(detalle){
  if(document.getElementById("banner-conexion")) return;
  const b = document.createElement("div");
  b.id = "banner-conexion";

  b.innerHTML = `<b>Sin conexión con la base de datos.</b> Los cambios pueden no guardarse.` +

    `<br><span style="opacity:.8;font-size:11.5px;">Revisá tu internet o las reglas de Firebase.</span>`;

}

    new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});

  const chip = document.getElementById("perfil-chip");
  chip.innerHTML = `<span class="nom">${miPerfil.nombre}</span>` +
    (soyCapitan() ? `<span class="capitan">CAPITÁN</span>` : "");
  const salir = document.createElement("button");
  salir.className = "salir";
  salir.textContent = "Cambiar";
  salir.onclick = cerrarSesion;
  chip.appendChild(salir);

  // Los exentos no cuentan: ni arriba ni abajo de "Pagaron X/Y".
  const paganCuota = data.jugadores.filter(j=>!j.exento);
  const cuotaOk = paganCuota.filter(j=>pagoLaFecha(j.id)).length;
  const sab = sabadoActivo();
  document.getElementById("st-plantel").textContent = data.jugadores.length;
  document.getElementById("st-cuota").textContent = cuotaOk + "/" + paganCuota.length;
  document.getElementById("st-sabado").textContent = (data.sabados[sab]||[]).length;

  const cont = document.getElementById("contenido");
  cont.innerHTML = "";
  // La animación solo al cambiar de pantalla; si no, parpadea en cada toque.
  cont.className = (tab !== tabAnterior) ? "anima" : "";
  tabAnterior = tab;
  if(tab==="sabado") cont.appendChild(vSabado());
  if(tab==="amistosos") cont.appendChild(vAmistosos());
  if(tab==="cuota") cont.appendChild(vCuota());
  if(tab==="plantel") cont.appendChild(vPlantel());
  if(tab==="stats") cont.appendChild(vStats());
  if(tab==="cuentas") cont.appendChild(vCuentas());
  if(tab==="asado") cont.appendChild(vAsado());
  if(tab==="mas") cont.appendChild(vMas());

  // Las pantallas de adentro llevan un "Volver" arriba de todo.
  if(SECUNDARIAS.some(s=>s.id===tab)){
    const volver = document.createElement("button");
    volver.className = "volver";
    volver.textContent = "‹ Volver";
    volver.onclick = ()=>{ tab = "mas"; render(); window.scrollTo(0,0); };
    cont.insertBefore(volver, cont.firstChild);
  }

  // Pie con la versión: de paso sirve para releer las novedades cuando quieras.
  const pie = document.createElement("div");
  pie.className = "pie-version";
  const bNov = document.createElement("button");
  bNov.className = "link-novedades";
  bNov.textContent = `Novedades · versión ${VERSION_APP}`;
  bNov.onclick = ()=> mostrarNovedades(true);
  pie.appendChild(bNov);
  cont.appendChild(pie);

  if(!novedadesMostradas && novedadesPendientes().length){
    novedadesMostradas = true;
    mostrarNovedades(false);
  }
}

// Sacar a alguien del plantel dejaba su id dando vueltas en las listas: seguía
// ocupando un lugar del cupo del sábado y aparecía como "(?)" en los mensajes.
// Esto lo borra de todas las ramas donde pueda haber quedado.
function purgarJugador(id){
  data.jugadores = data.jugadores.filter(x=>x.id !== id);
  data.admins = data.admins.filter(x=>x !== id);
  const sacarDe = obj=>{
    Object.keys(obj||{}).forEach(k=>{
      if(Array.isArray(obj[k])) obj[k] = obj[k].filter(x=>x !== id);
    });
  };
  sacarDe(data.sabados);
  sacarDe(data.sabadoNo);
  Object.keys(data.cuota||{}).forEach(f=>{ if(data.cuota[f]) delete data.cuota[f][id]; });
  const limpiarPartido = c=>{
    if(!c || typeof c !== "object") return;
    if(c.votosMvp){
      delete c.votosMvp[id];
      Object.keys(c.votosMvp).forEach(k=>{ if(c.votosMvp[k] === id) delete c.votosMvp[k]; });
    }
    if(Array.isArray(c.goleadores)) c.goleadores = c.goleadores.filter(g=>g.jugadorId !== id);
    if(c.mvp === id) c.mvp = "";
    if(c.equipos){
      if(Array.isArray(c.equipos.a)) c.equipos.a = c.equipos.a.filter(x=>x !== id);
      if(Array.isArray(c.equipos.b)) c.equipos.b = c.equipos.b.filter(x=>x !== id);
    }
  };
  Object.keys(data.sabadoConfig||{}).forEach(f=>limpiarPartido(data.sabadoConfig[f]));
  (data.amistosos||[]).forEach(a=>{
    if(Array.isArray(a.anotados)) a.anotados = a.anotados.filter(x=>x !== id);
    limpiarPartido(a);
  });
  (data.asados||[]).forEach(a=>{
    if(Array.isArray(a.aportes)) a.aportes = a.aportes.filter(x=>x.jugadorId !== id);
  });
  data.tricount = (data.tricount||[]).filter(g=>g.pagadorId !== id);
  data.tricount.forEach(g=>{
    if(Array.isArray(g.participantes)) g.participantes = g.participantes.filter(x=>x !== id);
  });
  data.tricount = data.tricount.filter(g=>(g.participantes||[]).length);
}
