// ---------- SÁBADO ----------
function vSabado(){
  const w = document.createElement("div");
  w.appendChild(bloqueImportante());
  const sab = sabadoActivo();
  if(!data.sabados[sab]) data.sabados[sab] = [];
  const conf = data.sabados[sab];
  const c = configSabado(sab);
  const yoVoy = conf.includes(miPerfil.id);
  const cupo = c.modo === "interno" ? CUPO_INTERNO : null;
  const { titulares, espera } = separarCupo(conf, cupo);
  const lleno = cupo !== null && conf.length >= cupo && !yoVoy;
  const esProximo = sab === proximoSabado();
  const esPasado = sab < hoyISO();

  // ===== Navegador de fechas =====
  // Solo para capitanes: el resto ve siempre el próximo partido y no se pierde.
  // (Al que le toca votar una figura vieja lo lleva "Lo importante", y vuelve
  // con el botón de abajo.)
  if(soyCapitan()){
  const nav = document.createElement("div");
  nav.className = "nav-fechas";
  const bPrev = document.createElement("button");
  bPrev.className = "ghost mini"; bPrev.textContent = "‹";
  bPrev.onclick = ()=>{ moverSabado(-7); render(); };
  const bNext = document.createElement("button");
  bNext.className = "ghost mini"; bNext.textContent = "›";
  bNext.onclick = ()=>{ moverSabado(7); render(); };
  const lbl = document.createElement("div");
  lbl.className = "nav-fechas-lbl";
  lbl.innerHTML = `<span>${new Date(sab+"T12:00:00").toLocaleDateString('es-AR',{day:'numeric',month:'long'})}</span>` +
    (esProximo ? `<span class="pill oro">próximo</span>` : (esPasado ? `<span class="pill">jugado</span>` : ""));
  nav.appendChild(bPrev); nav.appendChild(lbl); nav.appendChild(bNext);
  w.appendChild(nav);
  }
  if(!esProximo){
    const volver = document.createElement("button");
    volver.className = "ghost mini full";
    volver.textContent = "↩ Volver al próximo partido";
    volver.style.marginBottom = "12px";
    volver.onclick = ()=>{ sabadoVisto = proximoSabado(); render(); };
    w.appendChild(volver);
  }

  // ===== Bloque destacado: info + mi respuesta =====
  const d = document.createElement("div");
  d.className = "destacado";
  const llenado = cupo ? Math.min(100, Math.round(titulares.length / cupo * 100)) : 0;
  d.innerHTML = `
    <span class="etiqueta-tipo sabado">⚽ PARTIDO DEL SÁBADO</span>
    <div class="titulo">Sábado ${fechaLinda(sab)}</div>
    ${esProximo || !esPasado ? `<div class="cuenta-atras">${textoCuandoFalta(sab)}</div>` : ""}
    <div class="info-partido">
      <div class="info-hora">${c.hora ? c.hora + " hs" : "Hora a confirmar"}</div>
      <div class="info-linea">📍 ${textoLugar(c)}</div>
      <div class="info-linea">⚽ ${textoModo(c)}</div>
    </div>
    ${cupo ? `
      <div class="lugares">
        <div class="lugares-txt">
          <span>${titulares.length} de ${cupo} lugares</span>
          <span>${Math.max(0, cupo - titulares.length) === 0 ? "completo" : "quedan " + (cupo - titulares.length)}</span>
        </div>
        <div class="barra"><div class="barra-llena" style="width:${llenado}%"></div></div>
      </div>` : ""}`;
  d.appendChild(bloqueResultado(c, conf, async ()=>{ await guardar(); render(); }, sab, c.hora,
    `sabadoConfig/${sab}/votosMvp`));


  // Deber la cuota ya no te impide anotarte: se avisa, pero no se bloquea.
  if(lleno){
    const av = document.createElement("div");
    av.className = "aviso info";
    av.textContent = `Los ${cupo} lugares están completos. Si te anotás, quedás en lista de espera y entrás solo si alguien se baja.`;
    d.appendChild(av);
  }

  // La pregunta, bien grande, para que no haya que adivinar qué hacer.
  const preg = document.createElement("div");
  preg.className = "pregunta";
  preg.textContent = yoVoy
    ? "Estás anotado ✅"
    : (dijoSiJuega(sab, miPerfil.id) ? "Dijiste que no jugás" : "¿Jugás este sábado?");
  d.appendChild(preg);

  const fila = document.createElement("div");
  fila.className = "row";
  const bSi = document.createElement("button");
  bSi.textContent = "JUEGO";
  bSi.className = "btn-si" + (yoVoy ? "" : " inactivo");
  bSi.onclick = async ()=>{ await cambiarAnotado(sab, miPerfil.id, true); render(); };
  const bNo = document.createElement("button");
  bNo.textContent = "NO JUEGO";
  bNo.className = "btn-no" + (yoVoy ? " inactivo" : "");
  bNo.onclick = async ()=>{ await cambiarAnotado(sab, miPerfil.id, false); render(); };
  fila.appendChild(bSi); fila.appendChild(bNo);
  d.appendChild(fila);
  w.appendChild(d);

  // ===== Configuración (solo capitanes) =====
  if(soyCapitan()){
    const cfg = document.createElement("div");
    cfg.className = "card";
    cfg.innerHTML = `<h2>Configurar el partido</h2><p class="hint">Lo que pongas acá lo ven todos.</p>`;

    const rH = document.createElement("div"); rH.className="row";
    const inH = document.createElement("input");
    inH.type="time"; inH.value = c.hora || "";
    rH.innerHTML = `<label style="flex:0 0 70px;align-self:center;font-size:13px;color:var(--tinta-suave);font-weight:700;">Hora</label>`;
    rH.appendChild(inH);
    cfg.appendChild(rH);

    const rL = document.createElement("div"); rL.className="row";
    const selL = document.createElement("select");
    selL.innerHTML = LUGARES.map(l=>`<option value="${l}"${c.lugar===l?" selected":""}>${l}</option>`).join("");
    rL.innerHTML = `<label style="flex:0 0 70px;align-self:center;font-size:13px;color:var(--tinta-suave);font-weight:700;">Lugar</label>`;
    rL.appendChild(selL);
    cfg.appendChild(rL);

    const rLO = document.createElement("div"); rLO.className="row";
    rLO.style.display = c.lugar==="Otro" ? "flex" : "none";
    const inLO = document.createElement("input");
    inLO.type="text"; inLO.placeholder="¿Dónde?"; inLO.value = c.lugarOtro || "";
    rLO.appendChild(inLO);
    cfg.appendChild(rLO);
    selL.onchange = ()=>{ rLO.style.display = selL.value==="Otro" ? "flex" : "none"; };

    const rM = document.createElement("div"); rM.className="row";
    const selM = document.createElement("select");
    selM.innerHTML = `
      <option value="interno"${c.modo==="interno"?" selected":""}>Entre nosotros (${CUPO_INTERNO} lugares)</option>
      <option value="contra"${c.modo==="contra"?" selected":""}>Contra otro equipo</option>`;
    rM.innerHTML = `<label style="flex:0 0 70px;align-self:center;font-size:13px;color:var(--tinta-suave);font-weight:700;">Juego</label>`;
    rM.appendChild(selM);
    cfg.appendChild(rM);

    const rR = document.createElement("div"); rR.className="row";
    rR.style.display = c.modo==="contra" ? "flex" : "none";
    const inR = document.createElement("input");
    inR.type="text"; inR.placeholder="Nombre del rival"; inR.value = c.rival || "";
    rR.appendChild(inR);
    cfg.appendChild(rR);
    selM.onchange = ()=>{ rR.style.display = selM.value==="contra" ? "flex" : "none"; };

    const bG = document.createElement("button");
    bG.className="full"; bG.textContent="Guardar datos del partido";
    bG.onclick = async ()=>{
      c.hora = inH.value;
      c.lugar = selL.value;
      c.lugarOtro = inLO.value.trim();
      c.modo = selM.value;
      c.rival = inR.value.trim();
      await guardar(); render();
    };
    cfg.appendChild(bG);
    w.appendChild(cfg);
  }

  // ===== Lista del plantel =====
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h2>Quién juega</h2><p class="hint">${titulares.length} anotados${cupo ? " de " + cupo + " lugares" : ""}${espera.length ? ` · ${espera.length} en espera` : ""}</p>`;

  // Botón compartir a WhatsApp
  const bWsp = document.createElement("button");
  bWsp.className = "wsp full";
  bWsp.innerHTML = "Invitar al grupo de WhatsApp";
  bWsp.style.marginBottom = "12px";
  bWsp.onclick = ()=>{
    const faltan = data.jugadores.filter(j=>!dijoSiJuega(sab, j.id));
    const noVan = (data.sabadoNo[sab]||[]).filter(id=>data.jugadores.find(j=>j.id===id));
    let txt = `⚽ *URRACAS — SÁBADO ${fechaLinda(sab)}*\n\n`;
    txt += `🕐 ${c.hora ? c.hora + " hs" : "Hora a confirmar"}\n`;
    txt += `📍 ${textoLugar(c)}\n`;
    txt += `🆚 ${textoModo(c)}\n\n`;
    if(cupo){
      const quedan = Math.max(0, cupo - titulares.length);
      txt += quedan > 0
        ? `*Van ${titulares.length} de ${cupo} — quedan ${quedan} lugares* ⚡\n\n`
        : `*Los ${cupo} lugares están completos* (se anota igual en lista de espera)\n\n`;
    } else {
      txt += `*Van ${titulares.length} confirmados*\n\n`;
    }
    if(titulares.length){
      txt += `✅ *Confirmados:*\n` + titulares.map((id,i)=>`${i+1}. ${nombreDe(id)}`).join("\n") + "\n";
    }
    if(espera.length){
      txt += `\n⏳ *En espera:*\n` + espera.map((id,i)=>`${i+1}. ${nombreDe(id)}`).join("\n") + "\n";
    }
    if(noVan.length){
      txt += `\n🚫 *No pueden:* ` + noVan.map(id=>nombreDe(id)).join(", ") + "\n";
    }
    if(faltan.length){
      txt += `\n❓ *Todavía no contestaron:* ` + faltan.map(j=>j.nombre).join(", ") + "\n";
    }
    txt += pieInvitacion("Anotate acá");
    compartirWsp(txt);
  };
  card.appendChild(bWsp);

  const ul = document.createElement("ul");
  ul.className = "lista";
  if(!data.jugadores.length){ ul.innerHTML = `<li class="vacio">Sin jugadores.</li>`; }
  const orden = data.jugadores.slice().sort((a,b)=>{
    const ia = conf.indexOf(a.id), ib = conf.indexOf(b.id);
    if(ia === -1 && ib === -1) return 0;
    if(ia === -1) return 1;
    if(ib === -1) return -1;
    return ia - ib;
  });
  orden.forEach(j=>{
    const va = conf.includes(j.id);
    const enEspera = espera.includes(j.id);
    const ok = cuotaAlDia(j.id);
    const li = document.createElement("li");
    li.className = "item" + (enEspera ? " en-espera" : "");
    li.innerHTML = `${avatar(j.nombre)}
      <div class="item-main">
        <span class="item-nom">${j.nombre}${j.id===miPerfil.id?' <span class="yo">(vos)</span>':''}</span>
        <span class="item-sub">
          ${!ok ? '<span class="pill no">debe cuota</span>' : ''}
          ${enEspera ? '<span class="pill ambar">en espera</span>' : ''}
          ${!dijoSiJuega(sab, j.id) ? '<span class="pill">no contestó</span>' : ''}
        </span>
      </div>`;
    // Botón de verdad, no un span: se toca a cualquier edad y el celu lo trata
    // como botón. Sigue abierto a todos porque así se anota al que no usa la app.
    const t = document.createElement("button");
    t.className = "toggle" + (va ? (enEspera ? " espera" : "") : " no");
    t.textContent = enEspera ? "ESPERA" : (va ? "JUEGA" : "NO");
    t.title = (j.id === miPerfil.id ? "Cambiar tu respuesta" : "Cambiar la respuesta de " + j.nombre);
    t.onclick = async ()=>{ await cambiarAnotado(sab, j.id, !va); render(); };
    li.appendChild(t);
    ul.appendChild(li);
  });
  card.appendChild(ul);
  w.appendChild(card);

  // ===== Armado de equipos (solo si juegan entre ellos) =====
  if(c.modo === "interno" && titulares.length >= 4){
    const ce = document.createElement("div");
    ce.className = "card";
    ce.innerHTML = `<h2>Equipos</h2><p class="hint">Repartidos parejos según presentismo.</p>`;
    if(c.equipos && c.equipos.a && c.equipos.b){
      const grid = document.createElement("div");
      grid.className = "equipos-grid";
      grid.innerHTML = `
        <div class="equipo eq-a">
          <div class="eq-tit">Equipo A</div>
          ${c.equipos.a.map(id=>`<div class="eq-jug">${nombreDe(id)}</div>`).join("")}
        </div>
        <div class="equipo eq-b">
          <div class="eq-tit">Equipo B</div>
          ${c.equipos.b.map(id=>`<div class="eq-jug">${nombreDe(id)}</div>`).join("")}
        </div>`;
      ce.appendChild(grid);
      const bW2 = document.createElement("button");
      bW2.className = "wsp full"; bW2.textContent = "Compartir equipos";
      bW2.style.marginTop = "10px";
      bW2.onclick = ()=>{
        let t = `⚽ *URRACAS* — Equipos del ${fechaLinda(sab)}\n\n`;
        t += `*EQUIPO A*\n` + c.equipos.a.map(id=>"• "+nombreDe(id)).join("\n");
        t += `\n\n*EQUIPO B*\n` + c.equipos.b.map(id=>"• "+nombreDe(id)).join("\n");
        t += `\n\n${LINK_APP}`;
        compartirWsp(t);
      };
      ce.appendChild(bW2);
    }
    if(soyCapitan()){
      const bArmar = document.createElement("button");
      bArmar.className = "ghost full";
      bArmar.textContent = c.equipos ? "Volver a mezclar" : "Armar equipos";
      bArmar.style.marginTop = "10px";
      bArmar.onclick = async ()=>{
        c.equipos = armarEquipos(titulares);
        await guardar(); render();
      };
      ce.appendChild(bArmar);
    }
    w.appendChild(ce);
  }
  return w;
}

// ---------- CUOTA ----------
function vCuota(){
  const w = document.createElement("div");

  // Recordatorio si YO debo la cuota. Con el monto sin cargar no se le puede
  // reclamar nada a nadie: el que lee no sabe cuánto es ni a dónde mandarlo.
  if(!cuotaAlDia(miPerfil.id) && Number(data.montoCuota) > 0){
    const rec = document.createElement("div");
    rec.className = "recordatorio";
    const e = estadoCuota(fechaCuotaVigente(), miPerfil.id);
    rec.innerHTML = `<span class="ping"></span><div>${e.declarado
      ? "Ya avisaste que pagaste. <b>Falta que el capitán lo confirme.</b>"
      : "<b>Debés la cuota.</b> Pagá y marcá abajo que ya lo hiciste."}</div>`;
    w.appendChild(rec);
  }

  // Lo básico se pide ARRIBA. Estaba al fondo, debajo de la lista de 23, y en la
  // base real quedó sin cargar: nadie lo encontró.
  if(soyCapitan() && (!(Number(data.montoCuota) > 0) || !data.alias)){
    const cfg = document.createElement("div");
    cfg.className = "card";
    cfg.innerHTML = `<h2>Falta configurar la cuota</h2>
      <p class="hint">Sin esto, a los demás les aparece que deben pero no cuánto es ni a dónde transferir.</p>`;
    const campo = (placeholder, valor, ruta)=>{
      const r = document.createElement("div"); r.className = "row";
      const i = document.createElement("input");
      i.type = ruta === "montoCuota" ? "number" : "text";
      if(ruta === "montoCuota") i.inputMode = "numeric";
      i.placeholder = placeholder; i.value = valor || "";
      const b = document.createElement("button");
      b.textContent = "Guardar"; b.style.flex = "0 0 auto";
      b.onclick = async ()=>{
        const v = i.value.trim();
        if(!v) return;
        data[ruta] = v;
        await guardarRama(ruta, v);
        render();
      };
      r.appendChild(i); r.appendChild(b);
      cfg.appendChild(r);
    };
    if(!(Number(data.montoCuota) > 0)) campo("¿Cuánto sale la cuota por fecha?", data.montoCuota, "montoCuota");
    if(!data.alias) campo("Alias para transferir (ej. urracas.mp)", data.alias, "alias");
    w.appendChild(cfg);
  }

  const card = document.createElement("div");
  card.className = "card";
  const fa = fechaCuotaVista();
  const esVigente = fa === fechaCuotaVigente();
  card.innerHTML = `<h2>Cuota — ${etiquetaFecha(fa)}</h2>
    <p class="hint">${esVigente ? "Marcá si pagaste. El capitán confirma." : "Estás mirando un mes que ya pasó."}</p>`;
  if(!esVigente){
    const volver = document.createElement("button");
    volver.className = "ghost mini full";
    volver.textContent = "↩ Volver a " + etiquetaFecha(fechaCuotaVigente());
    volver.style.marginBottom = "12px";
    volver.onclick = ()=>{ fechaVista = fechaCuotaVigente(); render(); };
    card.appendChild(volver);
  }

  const row = document.createElement("div");
  row.className = "row";
  const sel = document.createElement("select");
  data.fechasCuota.forEach(f=>{
    const o = document.createElement("option");
    o.value=f; o.textContent=etiquetaFecha(f);
    if(f===fa) o.selected=true;
    sel.appendChild(o);
  });
  // Cambiar de mes es solo mirar: no se guarda ni le cambia la vista a nadie.
  sel.onchange = ()=>{ fechaVista = sel.value; render(); };
  row.appendChild(sel);
  // Solo se muestra si hay más de un mes; con uno solo, el selector sobra.
  if(data.fechasCuota.length > 1) card.appendChild(row);

  if(!data.jugadores.length){
    card.innerHTML += `<p class="vacio">Sin jugadores.</p>`;
    w.appendChild(card); return w;
  }

  const exentos = data.jugadores.filter(j=>j.exento);
  const paganCuota = data.jugadores.filter(j=>!j.exento);
  const pend = paganCuota.filter(j=>!estadoCuota(fa,j.id).confirmado);
  const conf = paganCuota.filter(j=>estadoCuota(fa,j.id).confirmado);

  // Botón para recordarle la cuota al grupo por WhatsApp.
  // Separa a los que no pagaron de los que ya avisaron y esperan confirmación.
  if(pend.length){
    const bWsp = document.createElement("button");
    bWsp.className = "wsp full";
    bWsp.textContent = "Recordar la cuota al grupo";
    bWsp.style.marginBottom = "12px";
    bWsp.onclick = ()=>{
      const deben = pend.filter(j=>!estadoCuota(fa,j.id).declarado);
      const porConfirmar = pend.filter(j=>estadoCuota(fa,j.id).declarado);
      const monto = Number(data.montoCuota) || 0;
      let t = `💰 *URRACAS — Cuota (${etiquetaFecha(fa)})*\n`;
      if(monto) t += `Son ${plata(monto)} por fecha\n`;
      if(data.alias) t += `\n💳 Transferí a: *${data.alias}*\n(y después marcá "PAGUÉ" en la app)\n`;
      if(deben.length){
        t += `\n❌ *Todavía no pagaron (${deben.length}):*\n` +
             deben.map(j=>{
               const n = fechasQueDebe(j.id).length;
               if(n <= 1) return `• ${j.nombre}`;
               return `• ${j.nombre} — ${n} fechas` + (deudaDe(j.id) ? ` (${plata(deudaDe(j.id))})` : "");
             }).join("\n") + "\n";
      }
      if(porConfirmar.length){
        t += `\n⏳ *Dicen que pagaron, falta confirmar (${porConfirmar.length}):*\n` +
             porConfirmar.map(j=>`• ${j.nombre}`).join("\n") + "\n";
      }
      t += pieInvitacion("Pagá y marcá acá");
      compartirWsp(t);
    };
    card.appendChild(bWsp);

    // Mismo mensaje pero parejo para todos, para pegar en una difusión.
    const bDif = document.createElement("button");
    bDif.className = "ghost full";
    bDif.textContent = "Copiar para lista de difusión";
    bDif.style.marginBottom = "12px";
    bDif.onclick = async ()=>{
      const ok = await copiar(textoDifusion());
      bDif.textContent = ok ? "¡Copiado! Pegalo en tu difusión" : "No se pudo copiar";
      setTimeout(()=>{ bDif.textContent = "Copiar para lista de difusión"; }, 2200);
    };
    card.appendChild(bDif);
  }

  // Confirmar de a uno es tedioso cuando pagaron ocho juntos.
  const dijeronQuePagaron = pend.filter(j=>estadoCuota(fa, j.id).declarado);
  if(soyCapitan() && dijeronQuePagaron.length > 1){
    const bTodos = document.createElement("button");
    bTodos.className = "full";
    bTodos.textContent = `Confirmar los ${dijeronQuePagaron.length} que dijeron que pagaron`;
    bTodos.style.marginBottom = "12px";
    bTodos.onclick = async ()=>{
      if(!confirm(`¿Dar por pagada la cuota de ${dijeronQuePagaron.map(j=>j.nombre).join(", ")}?`)) return;
      for(const j of dijeronQuePagaron){
        const e = estadoCuota(fa, j.id);
        e.confirmado = true;
        await guardarRama(`cuota/${fa}/${j.id}`, e);
      }
      render();
    };
    card.appendChild(bTodos);
  }

  if(data.alias){
    const ali = document.createElement("div");
    ali.className = "alias-box";
    ali.innerHTML = `<div class="txt"><div class="lbl">Transferí a</div><div class="alias">${data.alias}</div></div>`;
    const bCop = document.createElement("button");
    bCop.className = "mini";
    bCop.textContent = "Copiar";
    bCop.onclick = async ()=>{
      const ok = await copiar(data.alias);
      bCop.textContent = ok ? "¡Copiado!" : "No se pudo";
      setTimeout(()=>{ bCop.textContent = "Copiar"; }, 1500);
    };
    ali.appendChild(bCop);
    card.appendChild(ali);
  }

  const ul = document.createElement("ul");
  ul.className="lista";
  if(!pend.length) ul.innerHTML = `<li class="vacio">Todos confirmados 🙌</li>`;
  pend.forEach(j=>{
    const e = estadoCuota(fa, j.id);
    const yo = j.id===miPerfil.id;
    const li = document.createElement("li");
    li.className="item";
    const atrasadas = fechasQueDebe(j.id).length;
    li.innerHTML = `${avatar(j.nombre)}
      <div class="item-main">
        <span class="item-nom">${j.nombre}${yo?' <span class="yo">(vos)</span>':''}</span>
        ${atrasadas > 1 ? `<span class="item-sub"><span class="pill no">debe ${atrasadas} fechas${deudaDe(j.id)?" · "+plata(deudaDe(j.id)):""}</span></span>` : ""}
      </div>`;
    // Declaración: solo uno mismo
    if(yo){
      // Antes decía "PAGUÉ" / "NO PAGUÉ": no se entendía si era tu estado o el
      // botón para cambiarlo. Ahora uno es una acción y el otro un estado.
      const t = document.createElement("button");
      t.className = "toggle" + (e.declarado ? "" : " no");
      t.textContent = e.declarado ? "AVISASTE ✓" : "YA PAGUÉ";
      t.onclick = async ()=>{
        if(e.declarado && !confirm("¿Sacar el aviso de que pagaste?")) return;
        e.declarado = !e.declarado;
        await guardarRama(`cuota/${fa}/${j.id}`, e);
        render();
      };
      li.appendChild(t);
    } else {
      const p = document.createElement("span");
      p.className = "pill" + (e.declarado ? " oro" : "");
      p.textContent = e.declarado ? "dice que pagó" : "no pagó";
      li.appendChild(p);
    }
    // Recordatorio por privado: solo capitán, y no a uno mismo
    if(soyCapitan() && !yo){
      const bW = document.createElement("button");
      bW.className = "mini wsp";
      bW.textContent = "💬";
      bW.title = "Recordarle por WhatsApp";
      bW.onclick = async ()=>{
        const texto = textoDeuda(j);
        if(!wspPrivado(j.tel, texto)){
          const ok = await copiar(texto);
          alert(ok
            ? `${j.nombre} no tiene teléfono cargado (se carga tocando su nombre en Plantel).\n\nTe copié el mensaje para que se lo pegues.`
            : `${j.nombre} no tiene teléfono cargado. Cargalo en Plantel.`);
        }
      };
      li.appendChild(bW);
    }
    // Confirmación: solo capitán
    if(soyCapitan()){
      const b = document.createElement("button");
      b.className="mini"; b.textContent="OK";
      b.onclick = async ()=>{
        e.confirmado = true;
        await guardarRama(`cuota/${fa}/${j.id}`, e);
        render();
      };
      li.appendChild(b);
    }
    ul.appendChild(li);
  });
  card.appendChild(ul);

  if(conf.length){
    const sep = document.createElement("div");
    sep.className="separador";
    sep.textContent = `✅ Confirmados (${conf.length})`;
    card.appendChild(sep);
    const tags = document.createElement("div");
    tags.className="tags";
    conf.forEach(j=>{
      const t = document.createElement("span");
      t.className = "tag" + (soyCapitan() ? " quitar":"");
      t.textContent = j.nombre;
      if(soyCapitan()) t.onclick = async ()=>{
        // Es plata: un toque al voleo no puede desconfirmar un pago.
        if(!confirm(`¿Marcar que ${j.nombre} NO pagó?\n\nVa a volver a la lista de los que deben.`)) return;
        const e = estadoCuota(fa,j.id);
        e.confirmado = false;
        await guardarRama(`cuota/${fa}/${j.id}`, e);
        render();
      };
      tags.appendChild(t);
    });
    card.appendChild(tags);
  }

  if(exentos.length){
    const sepEx = document.createElement("div");
    sepEx.className="separador";
    sepEx.textContent = `🎟️ No pagan cuota (${exentos.length})`;
    card.appendChild(sepEx);
    const tagsEx = document.createElement("div");
    tagsEx.className="tags";
    exentos.forEach(j=>{
      const t = document.createElement("span");
      t.className = "tag";
      t.textContent = j.nombre;
      tagsEx.appendChild(t);
    });
    card.appendChild(tagsEx);
  }
  w.appendChild(card);

  // ===== CAJA DEL CLUB =====
  const caja = document.createElement("div");
  caja.className = "card";
  const rec = totalRecaudado(), gas = totalGastos(), saldo = rec - gas;
  caja.innerHTML = `<h2>💰 Caja del club</h2>
    <p class="hint">${data.montoCuota ? "Cuota de " + plata(data.montoCuota) + " por jugador" : "Cargá cuánto sale la cuota para calcular lo recaudado"}</p>
    <div class="stat-grande">
      <div class="stat-caja g"><span class="n">${plata(rec)}</span><span class="t">Recaudado</span></div>
      <div class="stat-caja p"><span class="n">${plata(gas)}</span><span class="t">Gastos</span></div>
      <div class="stat-caja ${saldo>=0?"g":"p"}"><span class="n">${plata(saldo)}</span><span class="t">Saldo</span></div>
    </div>`;

  if(soyCapitan()){
    const rMonto = document.createElement("div"); rMonto.className="row";
    const inMonto = document.createElement("input");
    inMonto.type="number"; inMonto.inputMode="numeric";
    inMonto.placeholder="¿Cuánto sale la cuota?"; inMonto.value = data.montoCuota;
    const bMonto = document.createElement("button");
    bMonto.className="ghost mini"; bMonto.textContent="Guardar"; bMonto.style.flex="0 0 auto";
    bMonto.onclick = async ()=>{ data.montoCuota = inMonto.value; await guardarRama("montoCuota", data.montoCuota); render(); };
    rMonto.appendChild(inMonto); rMonto.appendChild(bMonto);
    caja.appendChild(rMonto);

    // Alias para que cada uno transfiera sin que nadie tenga que perseguirlo.
    const rAlias = document.createElement("div"); rAlias.className="row";
    const inAlias = document.createElement("input");
    inAlias.type="text"; inAlias.placeholder="Alias para transferir (ej. urracas.mp)";
    inAlias.value = data.alias;
    const bAlias = document.createElement("button");
    bAlias.className="ghost mini"; bAlias.textContent="Guardar"; bAlias.style.flex="0 0 auto";
    bAlias.onclick = async ()=>{
      data.alias = inAlias.value.trim();
      await guardarRama("alias", data.alias);
      render();
    };
    rAlias.appendChild(inAlias); rAlias.appendChild(bAlias);
    caja.appendChild(rAlias);

    const sepG = document.createElement("div");
    sepG.className="separador"; sepG.textContent="Cargar un gasto";
    caja.appendChild(sepG);
    const rG = document.createElement("div"); rG.className="row";
    const inC = document.createElement("input");
    inC.type="text"; inC.placeholder="Concepto (cancha, pelota...)";
    const inM = document.createElement("input");
    inM.type="number"; inM.inputMode="numeric"; inM.placeholder="$"; inM.style.flex="0 0 90px";
    rG.appendChild(inC); rG.appendChild(inM);
    caja.appendChild(rG);
    const bG = document.createElement("button");
    bG.className="full"; bG.textContent="Agregar gasto";
    bG.onclick = async ()=>{
      const concepto = inC.value.trim(), monto = Number(inM.value)||0;
      if(!concepto || !monto){ alert("Poné concepto y monto."); return; }
      data.gastos.push({id:uid(), concepto, monto, fecha: hoyISO()});
      await guardar(); render();
    };
    caja.appendChild(bG);
  }

  if(data.gastos.length){
    const sepL = document.createElement("div");
    sepL.className="separador"; sepL.textContent="Gastos cargados";
    caja.appendChild(sepL);
    const ulG = document.createElement("ul");
    ulG.className="lista";
    data.gastos.slice().reverse().forEach(g=>{
      const li = document.createElement("li");
      li.className="item";
      li.innerHTML = `<div class="item-main">
          <span class="item-nom">${g.concepto}</span>
          <span class="item-sub">${fechaLinda(g.fecha)}</span>
        </div>
        <span class="pill no">-${plata(g.monto)}</span>`;
      if(soyCapitan()){
        const x = document.createElement("button");
        x.className="ghost mini"; x.textContent="✕";
        x.onclick = async ()=>{
          data.gastos = data.gastos.filter(y=>y.id!==g.id);
          await guardar(); render();
        };
        li.appendChild(x);
      }
      ulG.appendChild(li);
    });
    caja.appendChild(ulG);
  }
  w.appendChild(caja);
  return w;
}

// ---------- PLANTEL ----------
function vPlantel(){
  const w = document.createElement("div");
  const card = document.createElement("div");
  card.className="card";
  card.innerHTML = `<h2>Plantel</h2><p class="hint">${data.jugadores.length} jugadores · el número es cuántos sábados jugó cada uno${soyCapitan()?" · tocá ☆ para hacer capitán y $ para eximir de la cuota":""}</p>`;

  if(soyCapitan()){
    const row = document.createElement("div");
    row.className="row";
    const inp = document.createElement("input");
    inp.type="text"; inp.placeholder="Nombre del jugador"; inp.id="nuevo-jug";
    row.appendChild(inp);
    const b = document.createElement("button");
    b.textContent="Agregar"; b.style.flex="0 0 auto";
    b.onclick = async ()=>{
      const n = inp.value.trim();
      if(!n) return;
      // `desde` marca a partir de qué fecha se le cuenta la cuota.
      data.jugadores.push({id:uid(), nombre:n, exento:false, desde:fechaCuotaVigente()});
      await guardar(); render();
    };
    row.appendChild(b);
    card.appendChild(row);
  } else {
    const a = document.createElement("div");
    a.className="aviso info";
    a.textContent = "Solo los capitanes pueden agregar o quitar jugadores, confirmar pagos y cargar resultados.";
    card.appendChild(a);
    // Para que un capitán no dependa de que otro capitán lo ascienda.
    const bCod = document.createElement("button");
    bCod.className="ghost full";
    bCod.textContent="Tengo el código de capitán";
    bCod.style.marginBottom="10px";
    bCod.onclick = async ()=>{
      const c = prompt("Código de capitán:");
      if(c === null) return;
      if(c.trim() !== CODIGO_CAPITAN){ alert("Código incorrecto."); return; }
      if(!data.admins.includes(miPerfil.id)) data.admins.push(miPerfil.id);
      await guardarRama("admins", data.admins);
      render();
    };
    card.appendChild(bCod);
  }

  const ul = document.createElement("ul");
  ul.className="lista";
  if(!data.jugadores.length) ul.innerHTML = `<li class="vacio">Sin jugadores.</li>`;
  data.jugadores.slice().sort((a,b)=>partidosJugados(b.id)-partidosJugados(a.id)).forEach(j=>{
    const yo = j.id===miPerfil.id;
    const li = document.createElement("li");
    li.className="item";
    li.innerHTML = `${avatar(j.nombre)}
      <div class="item-main">
        <span class="item-nom">${j.nombre}${yo?' <span class="yo">(vos)</span>':''}</span>
        <span class="item-sub">
          ${esAdmin(j.id)?'<span class="pill oro">capitán</span>':''}
          ${j.exento?'<span class="pill">no paga cuota</span>':''}
          <span class="pill">${partidosJugados(j.id)} partidos</span>
        </span>
      </div>`;
    if(soyCapitan()){
      // El teléfono se edita tocando la píldora, para no meter otro botón en la fila.
      const sub = li.querySelector(".item-sub");
      const tel = document.createElement("span");
      tel.className = "pill" + (j.tel ? "" : " no");
      tel.style.cursor = "pointer";
      tel.textContent = j.tel ? "📱 " + j.tel : "📱 sin teléfono";
      tel.onclick = async ()=>{
        const v = prompt(`Teléfono de ${j.nombre}\n(con código de área y sin el 15, ej. 3511234567)`, j.tel || "");
        if(v === null) return;
        j.tel = v.trim();
        await guardar(); render();
      };
      sub.appendChild(tel);

      const bCap = document.createElement("button");
      bCap.className = esAdmin(j.id) ? "ghost mini" : "mini";
      bCap.textContent = esAdmin(j.id) ? "★" : "☆";
      bCap.title = esAdmin(j.id) ? "Sacarle capitán" : "Hacerlo capitán";
      bCap.onclick = async ()=>{
        if(esAdmin(j.id)){
          if(data.admins.length <= 1){ alert("Tiene que quedar al menos un capitán."); return; }
          if(!confirm(`¿Sacarle el rol de capitán a ${j.nombre}?`)) return;
          data.admins = data.admins.filter(x=>x!==j.id);
        } else {
          if(!confirm(`¿Hacer capitán a ${j.nombre}? Va a poder confirmar cuotas, cargar resultados y editar el plantel.`)) return;
          data.admins.push(j.id);
        }
        await guardar(); render();
      };
      li.appendChild(bCap);

      const bEx = document.createElement("button");
      bEx.className = j.exento ? "mini" : "ghost mini";
      bEx.textContent = "$";
      bEx.title = j.exento ? "Volver a cobrarle la cuota" : "Eximirlo de la cuota";
      bEx.onclick = async ()=>{
        if(j.exento){
          if(!confirm(`¿Volver a cobrarle la cuota a ${j.nombre}?`)) return;
          j.exento = false;
        } else {
          if(!confirm(`¿Eximir a ${j.nombre} de pagar la cuota? Sigue siendo del plantel y se puede anotar a los partidos, pero no se le reclama la cuota.`)) return;
          j.exento = true;
        }
        await guardar(); render();
      };
      li.appendChild(bEx);

      const b = document.createElement("button");
      b.className="danger mini";
      b.textContent="Quitar";
      b.onclick = async ()=>{
        const saldo = balancesTricount(data.tricount)[j.id] || 0;
        if(Math.abs(saldo) > 0.5){
          alert(`${j.nombre} tiene cuentas sin saldar (${plata(Math.abs(saldo))} ${saldo>0?"a favor":"en contra"}).\n\nSaldá eso en la pestaña Cuentas antes de sacarlo, o los números del resto quedan mal.`);
          return;
        }
        const msg = (esAdmin(j.id) ? `${j.nombre} es capitán.\n\n` : "") +
          `¿Quitar a ${j.nombre} del plantel?\n\n` +
          `Se va con sus ${partidosJugados(j.id)} partido(s), sus goles y su historial de cuota.`;
        if(!confirm(msg)) return;
        purgarJugador(j.id);
        await guardar(); render();
      };
      li.appendChild(b);
    }
    ul.appendChild(li);
  });
  card.appendChild(ul);
  w.appendChild(card);
  return w;
}

// ---------- AMISTOSOS ----------

    await guardar(); render();

  card.appendChild(b);
  w.appendChild(card);

  const lc = document.createElement("div");
  lc.className="card";
  lc.innerHTML = `<h2>Próximos</h2>`;

      <div class="evento-cab">
        <div>
          <div class="evento-tit">vs ${am.rival}</div>
          <div class="evento-meta">${fechaLinda(am.fecha)}${am.hora?" · "+am.hora+" hs":""}${am.cancha?" · "+am.cancha:""}</div>
        </div>
        <span class="pill">${am.anotados.length} anotados</span>
      </div>`;
    ev.appendChild(bloqueResultado(am, am.anotados, async ()=>{ await guardar(); render(); }, am.fecha, am.hora,
      `amistosos/${data.amistosos.indexOf(am)}/votosMvp`));
    const bDet = document.createElement("button");
    bDet.className="ghost mini full";
    bDet.textContent="Ver detalle";
    bDet.style.marginBottom="8px";
    bDet.onclick = ()=>{
      abrirDetalle({
        titulo: "AMISTOSO",
        sub: "vs " + am.rival,
        filas: [
          {lbl:"Fecha", val: new Date(am.fecha+"T12:00:00").toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})},
          {lbl:"Hora", val: am.hora ? am.hora + " hs" : "A confirmar"},
          {lbl:"Lugar", val: am.cancha || "A confirmar"},
          {lbl:"Anotados", val: String(am.anotados.length)}
        ],
        anotados: am.anotados.map(id=>nombreDe(id))
      });
    };
    ev.appendChild(bDet);
    const bWA = document.createElement("button");
    bWA.className="wsp mini full";
    bWA.textContent="Invitar al grupo";
    bWA.style.marginBottom="8px";
    bWA.onclick = ()=>{
      const faltan = data.jugadores.filter(j=>!am.anotados.includes(j.id));
      let t = `🤝 *AMISTOSO — URRACAS vs ${am.rival.toUpperCase()}*\n\n`;
      t += `📅 ${new Date(am.fecha+"T12:00:00").toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}\n`;
      t += `🕐 ${am.hora ? am.hora + " hs" : "Hora a confirmar"}\n`;
      t += `📍 ${am.cancha || "A confirmar"}\n\n`;
      t += `*Van ${am.anotados.length} anotados*\n`;
      if(am.anotados.length){
        t += am.anotados.map((id,i)=>`${i+1}. ${nombreDe(id)}`).join("\n") + "\n";
      }
      if(faltan.length){
        t += `\n❓ *Faltan:* ` + faltan.map(j=>j.nombre).join(", ") + "\n";
      }
      t += pieInvitacion("Anotate acá");
      compartirWsp(t);
    };
    ev.appendChild(bWA);
    const yoAnotado = am.anotados.includes(miPerfil.id);
    const bA = document.createElement("button");
    bA.className = "full" + (yoAnotado ? " danger" : "");
    bA.textContent = yoAnotado ? "Bajarme" : "Anotarme";
    bA.onclick = async ()=>{
      if(yoAnotado) am.anotados = am.anotados.filter(i=>i!==miPerfil.id);
      else am.anotados.push(miPerfil.id);
      await guardar(); render();
    };
    ev.appendChild(bA);
    if(am.anotados.length){
      const tg = document.createElement("div");
      tg.className="tags";
      am.anotados.forEach(id=>{
        const t = document.createElement("span");
        t.className="tag" + (soyCapitan()?" quitar":"");
        t.textContent = nombreDe(id);
        if(soyCapitan()) t.onclick = async ()=>{
          am.anotados = am.anotados.filter(x=>x!==id);
          await guardar(); render();
        };
        tg.appendChild(t);
      });
      ev.appendChild(tg);
    }
    const bD = document.createElement("button");
    bD.className="danger mini"; bD.textContent="Borrar amistoso";
    bD.style.marginTop="10px";
    bD.onclick = async ()=>{
      if(!confirm(`¿Borrar el amistoso vs ${am.rival}?`)) return;
      data.amistosos = data.amistosos.filter(x=>x.id!==am.id);
      await guardar(); render();
    };
    ev.appendChild(bD);
    lc.appendChild(ev);
  });
  w.appendChild(lc);
  return w;
}

  const conMvp = data.jugadores.filter(j=>mvpsDe(j.id)>0).sort((a,b)=>mvpsDe(b.id)-mvpsDe(a.id));

          </div>
          <span class="res-pill ${claseResultado(p.cfg.resultado)}">${etiquetaResultado(p.cfg.resultado)}${(p.cfg.golesF!==""&&p.cfg.golesC!=="")?` ${p.cfg.golesF}-${p.cfg.golesC}`:""}</span>
        </div>`;

// ---------- CUENTAS (TRICOUNT) ----------
function vCuentas(){
  const w = document.createElement("div");
  const gastos = data.tricount;
  const bal = balancesTricount(gastos);
  const miBal = bal[miPerfil.id] || 0;

  // Mi situación
  const mi = document.createElement("div");
  mi.className = "destacado" + (miBal < -0.5 ? " debe-tema" : "");
  mi.innerHTML = `<span class="etiqueta-tipo ${miBal<-0.5?"amistoso":"sabado"}">💸 MI CUENTA</span>
    <div class="mi-saldo ${miBal>0.5?"positivo":miBal<-0.5?"negativo":"neutro"}">
      ${miBal>0.5 ? "Te deben "+plata(miBal) : miBal<-0.5 ? "Debés "+plata(-miBal) : "Estás al día 🙌"}
    </div>
    <div class="mi-saldo-sub">Total gastado entre todos: ${plata(totalTricount(gastos))}</div>`;
  w.appendChild(mi);

  // Cargar gasto
  const alta = document.createElement("div");
  alta.className = "card";
  alta.innerHTML = `<h2>Cargar un gasto</h2><p class="hint">Quién puso la plata y entre quiénes se divide.</p>`;

  const rC = document.createElement("div"); rC.className="row";
  const inC = document.createElement("input");
  inC.type="text"; inC.placeholder="Concepto (carne, bebida, cancha...)";
  rC.appendChild(inC);
  alta.appendChild(rC);

  const rM = document.createElement("div"); rM.className="row";
  const inM = document.createElement("input");
  inM.type="number"; inM.inputMode="decimal"; inM.placeholder="Monto $";
  const selP = document.createElement("select");
  selP.innerHTML = data.jugadores.map(j=>
    `<option value="${j.id}"${j.id===miPerfil.id?" selected":""}>Pagó ${j.nombre}</option>`).join("");
  rM.appendChild(inM); rM.appendChild(selP);
  alta.appendChild(rM);

  const sep = document.createElement("div");
  sep.className="separador"; sep.textContent="¿Entre quiénes se divide?";
  alta.appendChild(sep);

  const acciones = document.createElement("div");
  acciones.className="row";
  const bTodos = document.createElement("button");
  bTodos.className="ghost mini"; bTodos.textContent="Todos";
  const bNadie = document.createElement("button");
  bNadie.className="ghost mini"; bNadie.textContent="Ninguno";
  acciones.appendChild(bTodos); acciones.appendChild(bNadie);
  alta.appendChild(acciones);

  const grid = document.createElement("div");
  grid.className="voto-grid";
  const seleccion = new Set(data.jugadores.map(j=>j.id));
  const pintar = ()=>{
    grid.innerHTML="";
    data.jugadores.forEach(j=>{
      const b = document.createElement("button");
      b.className = "voto-btn" + (seleccion.has(j.id) ? " elegido" : "");
      b.textContent = j.nombre;
      b.onclick = ()=>{
        if(seleccion.has(j.id)) seleccion.delete(j.id); else seleccion.add(j.id);
        pintar();
      };
      grid.appendChild(b);
    });
  };
  pintar();
  bTodos.onclick = ()=>{ data.jugadores.forEach(j=>seleccion.add(j.id)); pintar(); };
  bNadie.onclick = ()=>{ seleccion.clear(); pintar(); };
  alta.appendChild(grid);

  const bAdd = document.createElement("button");
  bAdd.className="full"; bAdd.textContent="Agregar gasto";
  bAdd.style.marginTop="12px";
  bAdd.onclick = async ()=>{
    const concepto = inC.value.trim();
    const monto = Number(inM.value)||0;
    if(!concepto || !monto){ alert("Poné concepto y monto."); return; }
    if(!seleccion.size){ alert("Elegí entre quiénes se divide."); return; }
    data.tricount.push({
      id: uid(), concepto, monto,
      pagadorId: selP.value,
      participantes: Array.from(seleccion),
      fecha: hoyISO()
    });
    await guardar(); render();
  };
  alta.appendChild(bAdd);
  w.appendChild(alta);

  // Quién le debe a quién
  const pagos = liquidar(bal);
  const cL = document.createElement("div");
  cL.className="card";
  cL.innerHTML = `<h2>Cómo se salda</h2><p class="hint">La forma más corta de quedar a mano.</p>`;
  if(!pagos.length){
    cL.innerHTML += `<p class="vacio">${gastos.length ? "Están todos a mano 🙌" : "Todavía no hay gastos cargados."}</p>`;
  }
  pagos.forEach(p=>{
    const li = document.createElement("div");
    li.className = "pago-fila" + (p.de===miPerfil.id ? " mio" : "");
    li.innerHTML = `<span class="pago-de">${nombreDe(p.de)}</span>
      <span class="pago-flecha">→</span>
      <span class="pago-a">${nombreDe(p.a)}</span>
      <span class="pago-monto">${plata(p.monto)}</span>`;
    cL.appendChild(li);
  });
  if(pagos.length){
    const bW = document.createElement("button");
    bW.className="wsp full"; bW.textContent="Compartir cuentas";
    bW.style.marginTop="12px";
    bW.onclick = ()=>{
      let t = `💸 *URRACAS — Cuentas*\n`;
      t += `Total gastado: ${plata(totalTricount(gastos))}\n\n`;
      t += `*Gastos:*\n`;
      gastos.forEach(g=>{ t += `• ${g.concepto}: ${plata(g.monto)} (puso ${nombreDe(g.pagadorId)})\n`; });
      t += `\n*Para quedar a mano:*\n`;
      pagos.forEach(p=>{ t += `• ${nombreDe(p.de)} → ${nombreDe(p.a)}: ${plata(p.monto)}\n`; });
      t += `\n${LINK_APP}`;
      compartirWsp(t);
    };
    cL.appendChild(bW);
  }
  w.appendChild(cL);

  // Balance de cada uno
  if(gastos.length){
    const cB = document.createElement("div");
    cB.className="card";
    cB.innerHTML = `<h2>Balance de cada uno</h2>`;
    const ulB = document.createElement("ul");
    ulB.className="lista";
    data.jugadores.slice()
      .filter(j=>Math.abs(bal[j.id]||0) > 0.5 || gastos.some(g=>g.participantes.includes(j.id)||g.pagadorId===j.id))
      .sort((a,b)=>(bal[b.id]||0)-(bal[a.id]||0))
      .forEach(j=>{
        const v = bal[j.id]||0;
        const li = document.createElement("li");
        li.className="item";
        li.innerHTML = `<div class="item-main">
            <span class="item-nom">${j.nombre}${j.id===miPerfil.id?' <span class="yo">(vos)</span>':''}</span>
          </div>
          <span class="pill ${v>0.5?"ok":v<-0.5?"no":""}">${v>0.5?"+"+plata(v):v<-0.5?"-"+plata(-v):"a mano"}</span>`;
        ulB.appendChild(li);
      });
    cB.appendChild(ulB);
    w.appendChild(cB);
  }

  // Lista de gastos
  const cG = document.createElement("div");
  cG.className="card";
  cG.innerHTML = `<h2>Gastos cargados</h2>`;
  if(!gastos.length){
    cG.innerHTML += `<p class="vacio">Ninguno todavía.</p>`;
  }
  gastos.slice().reverse().forEach(g=>{
    const li = document.createElement("li");
    li.className="item";
    li.innerHTML = `<div class="item-main">
        <span class="item-nom">${g.concepto}</span>
        <span class="item-sub">Puso ${nombreDe(g.pagadorId)} · entre ${g.participantes.length} · ${plata((Number(g.monto)||0)/Math.max(1,g.participantes.length))} c/u</span>
      </div>
      <span class="pill oro">${plata(g.monto)}</span>`;
    if(g.pagadorId===miPerfil.id || soyCapitan()){
      const x = document.createElement("button");
      x.className="ghost mini"; x.textContent="✕";
      x.onclick = async ()=>{
        if(!confirm(`¿Borrar el gasto "${g.concepto}"?`)) return;
        data.tricount = data.tricount.filter(y=>y.id!==g.id);
        await guardar(); render();
      };
      li.appendChild(x);
    }
    cG.appendChild(li);
  });
  if(gastos.length && soyCapitan()){
    const bR = document.createElement("button");
    bR.className="danger full"; bR.textContent="Saldar todo y empezar de cero";
    bR.style.marginTop="12px";
    bR.onclick = async ()=>{
      if(!confirm("Esto borra todos los gastos cargados. ¿Seguro? Usalo cuando ya se pagaron entre todos.")) return;
      data.tricount = [];
      await guardar(); render();
    };
    cG.appendChild(bR);
  }
  w.appendChild(cG);
  return w;
}

// ---------- ASADO ----------
const APORTES = ["Carne","Chorizo","Bebida","Hielo","Carbón","Pan","Ensalada","Postre","Platos y cubiertos"];

function vAsado(){
  const w = document.createElement("div");
  const card = document.createElement("div");
  card.className="card";
  card.innerHTML = `<h2>Nuevo asado</h2><p class="hint">Cargá la fecha y después cada uno dice qué lleva.</p>`;
  const r1 = document.createElement("div"); r1.className="row";
  r1.innerHTML = `<input type="date" id="as-fecha">`;
  card.appendChild(r1);
  const r2 = document.createElement("div"); r2.className="row";
  r2.innerHTML = `<input type="text" id="as-lugar" placeholder="Lugar (casa de...)" autocomplete="off">`;
  card.appendChild(r2);
  const b = document.createElement("button");
  b.className="full"; b.textContent="Crear asado";
  b.onclick = async ()=>{
    const fecha = document.getElementById("as-fecha").value;
    const lugar = document.getElementById("as-lugar").value.trim();
    if(!fecha){ alert("Elegí una fecha."); return; }
    data.asados.push({id:uid(), fecha, lugar, aportes:[]});
    await guardar(); render();
  };
  card.appendChild(b);
  w.appendChild(card);

  const lc = document.createElement("div");
  lc.className="card";
  lc.innerHTML = `<h2>Próximos asados</h2>`;
  const ord = data.asados.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(!ord.length) lc.innerHTML += `<p class="vacio">No hay asados.</p>`;
  ord.forEach(as=>{
    const ev = document.createElement("div");
    ev.className="evento";
    ev.innerHTML = `<div class="evento-cab">
        <div>
          <div class="evento-tit">🔥 ${fechaLinda(as.fecha)}</div>
          <div class="evento-meta">${as.lugar || "Lugar a confirmar"}</div>
        </div>
        <span class="pill">${as.aportes.length} aportes</span>
      </div>`;

    // Yo llevo: selector simple + campo libre
    const r = document.createElement("div");
    r.className="row";
    const sel = document.createElement("select");
    sel.innerHTML = `<option value="">Yo llevo...</option>` +
      APORTES.map(a=>`<option value="${a}">${a}</option>`).join("") +
      `<option value="__otro">Otra cosa...</option>`;
    r.appendChild(sel);
    const bAdd = document.createElement("button");
    bAdd.textContent="Sumar"; bAdd.style.flex="0 0 auto";
    r.appendChild(bAdd);
    ev.appendChild(r);

    const rOtro = document.createElement("div");
    rOtro.className="row"; rOtro.style.display="none";
    const inOtro = document.createElement("input");
    inOtro.type="text"; inOtro.placeholder="¿Qué llevás?"; inOtro.autocomplete="off";
    rOtro.appendChild(inOtro);
    ev.appendChild(rOtro);

    sel.onchange = ()=>{ rOtro.style.display = sel.value==="__otro" ? "flex" : "none"; };
    bAdd.onclick = async ()=>{
      let trae = sel.value;
      if(trae==="__otro") trae = inOtro.value.trim();
      if(!trae){ alert("Elegí o escribí qué llevás."); return; }
      as.aportes.push({jugadorId: miPerfil.id, trae});
      await guardar(); render();
    };

    const ul = document.createElement("ul");
    ul.className="lista";
    if(!as.aportes.length) ul.innerHTML = `<li class="vacio">Nadie anotó nada todavía.</li>`;
    as.aportes.forEach((ap,idx)=>{
      const li = document.createElement("li");
      li.className="item";
      li.innerHTML = `<div class="item-main"><span class="item-nom">${nombreDe(ap.jugadorId)}</span></div>
                      <span class="pill oro">${ap.trae}</span>`;
      // Cada uno borra lo suyo; el capitán puede borrar cualquiera
      if(ap.jugadorId===miPerfil.id || soyCapitan()){
        const x = document.createElement("button");
        x.className="ghost mini"; x.textContent="✕";
        x.onclick = async ()=>{ as.aportes.splice(idx,1); await guardar(); render(); };
        li.appendChild(x);
      }
      ul.appendChild(li);
    });
    ev.appendChild(ul);

    const bWAs = document.createElement("button");
    bWAs.className="wsp full"; bWAs.textContent="Invitar al grupo";
    bWAs.style.marginTop="10px";
    bWAs.onclick = ()=>{
      const traidos = as.aportes.map(a=>a.trae.toLowerCase());
      const faltantes = APORTES.filter(a=>!traidos.some(t=>t.includes(a.toLowerCase())));
      const sinAnotar = data.jugadores.filter(j=>!as.aportes.some(a=>a.jugadorId===j.id));
      let t = `🔥 *ASADO URRACAS*\n\n`;
      t += `📅 ${new Date(as.fecha+"T12:00:00").toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}\n`;
      t += `📍 ${as.lugar || "Lugar a confirmar"}\n\n`;
      if(as.aportes.length){
        t += `✅ *Ya está cubierto:*\n`;
        t += as.aportes.map(a=>`• ${a.trae} — ${nombreDe(a.jugadorId)}`).join("\n") + "\n";
      } else {
        t += `_Todavía no anotó nadie qué lleva._\n`;
      }
      if(faltantes.length){
        t += `\n❌ *Falta que alguien lleve:*\n${faltantes.join(", ")}\n`;
      }
      if(sinAnotar.length){
        t += `\n❓ *Sin anotar nada:* ` + sinAnotar.map(j=>j.nombre).join(", ") + "\n";
      }
      t += pieInvitacion("Anotá qué llevás acá");
      compartirWsp(t);
    };
    ev.appendChild(bWAs);

    const bD = document.createElement("button");
    bD.className="danger mini"; bD.textContent="Borrar asado";
    bD.style.marginTop="10px";
    bD.onclick = async ()=>{
      if(!confirm("¿Borrar este asado?")) return;
      data.asados = data.asados.filter(x=>x.id!==as.id);
      await guardar(); render();
    };
    ev.appendChild(bD);
    lc.appendChild(ev);
  });
  w.appendChild(lc);
  return w;
}
