<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Urracas</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap');

:root{
  --azul: #3B7BF0;
  --azul-dark: #1B49A8;
  --azul-soft: #7FADFF;
  --fondo: #0B0E14;
  --superficie: #151A23;
  --superficie-2: #1E242F;
  --superficie-3: #2A313E;
  --tinta: #EDF1F7;
  --tinta-suave: #97A1B2;
  --ok: #35C46B;
  --ok-bg: rgba(53,196,107,0.14);
  --pend: #F26058;
  --pend-bg: rgba(242,96,88,0.14);
  --oro: #FFC940;
  --ambar: #FF9F2A;
  --linea: rgba(237,241,247,0.10);
  --radio: 14px;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body{ margin:0; padding:0; }
body{
  background: var(--fondo);
  color: var(--tinta);
  font-family:'Work Sans', -apple-system, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  min-height:100vh;
  overscroll-behavior-y: none;
}

.app{
  max-width: 620px;
  margin: 0 auto;
  padding: 0 14px calc(96px + env(safe-area-inset-bottom));
}

/* ============ HEADER ============ */
.header{
  position: relative;
  margin: 0 -14px 16px;
  padding: calc(16px + env(safe-area-inset-top)) 16px 18px;
  background:
    radial-gradient(120% 100% at 50% 0%, #24408A 0%, #10192B 55%, var(--fondo) 100%);
  border-bottom: 1px solid var(--linea);
}
.header-top{ display:flex; align-items:center; gap: 12px; }
.escudo{ flex-shrink:0; filter: drop-shadow(0 3px 8px rgba(0,0,0,0.5)); }
.header-txt{ flex:1; min-width:0; }
.header-txt h1{
  font-family:'Bebas Neue', sans-serif;
  font-size: clamp(26px, 8vw, 34px);
  letter-spacing: 2px;
  margin: 0;
  line-height: 1;
  color:#fff;
}
.header-txt .fecha{
  font-size: 12.5px;
  color: var(--tinta-suave);
  text-transform: capitalize;
  margin-top: 2px;
}
.perfil-chip{
  display:flex; align-items:center; gap:8px;
  margin-top: 14px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 999px;
  padding: 7px 8px 7px 14px;
  font-size: 14px;
}
.perfil-chip .nom{ font-weight:700; }
.perfil-chip .capitan{
  background: var(--oro); color:#3A2A00;
  font-family:'Bebas Neue',sans-serif; font-size: 11px; letter-spacing:.7px;
  padding: 3px 8px; border-radius: 999px;
}
.perfil-chip .salir{
  margin-left:auto;
  background: rgba(255,255,255,0.12);
  border:none; color: var(--tinta);
  font-size: 12.5px; font-weight:600;
  padding: 7px 13px; border-radius: 999px;
  min-height: 0; cursor:pointer;
}

/* ============ STATS ============ */
.stats{ display:grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 14px; }
.stat{
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 12px;
  padding: 11px 6px;
  text-align:center;
}
.stat .num{
  font-family:'JetBrains Mono', monospace;
  font-size: clamp(18px, 6vw, 23px); font-weight:700;
  color: var(--oro); display:block; line-height:1.1;
}
.stat .lbl{
  font-size: 9.5px; text-transform: uppercase; letter-spacing: .5px;
  color: var(--tinta-suave); margin-top: 3px; display:block;
}

/* ============ CARDS ============ */
.card{
  background: var(--superficie);
  border: 1px solid var(--linea);
  border-radius: var(--radio);
  padding: 16px;
  margin-bottom: 14px;
}
.card h2{
  font-family:'Bebas Neue', sans-serif;
  letter-spacing: .8px; font-size: 20px;
  margin: 0 0 4px; color: #fff;
}
.card .hint{ font-size: 13px; color: var(--tinta-suave); margin: 0 0 14px; }
.card h2 + .lista, .card h2 + .row{ margin-top: 12px; }

/* ============ CONTROLES ============ */
.row{ display:flex; gap:8px; margin-bottom: 10px; }
.row.col{ flex-direction: column; }
.row > *{ flex:1; min-width:0; }

input, select{
  font-family:'Work Sans', sans-serif;
  font-size: 16px; /* 16px evita el zoom automático en iPhone */
  padding: 13px 12px;
  border-radius: 11px;
  border: 1px solid var(--linea);
  background: var(--superficie-2);
  color: var(--tinta);
  width:100%;
  -webkit-appearance:none; appearance:none;
}
select{
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2397A1B2' stroke-width='2'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
  background-repeat:no-repeat; background-position: right 12px center; background-size: 18px;
  padding-right: 38px;
}
input::placeholder{ color: #63708A; }
input:focus, select:focus{ outline:none; border-color: var(--azul); }

button{
  font-family:'Work Sans', sans-serif;
  font-weight:700; font-size: 15px;
  padding: 13px 16px;
  border-radius: 11px; border:none;
  background: var(--azul); color:#fff;
  cursor:pointer; min-height: 48px;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
button:active{ transform: scale(0.98); }
button.ghost{ background: var(--superficie-2); color: var(--tinta); border:1px solid var(--linea); }
button.danger{ background: var(--pend-bg); color: var(--pend); border:1px solid rgba(242,96,88,0.35); }
button.mini{ min-height: 38px; padding: 8px 12px; font-size: 13px; border-radius: 9px; }
button:disabled{ opacity:.4; }
button.full{ width:100%; }

/* ============ LISTA DE JUGADORES ============ */
.lista{ list-style:none; margin:0; padding:0; }
.item{
  display:flex; align-items:center; gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid var(--linea);
}
.item:last-child{ border-bottom:none; }
.item-main{ flex:1; min-width:0; }
.item-nom{ font-weight:600; font-size: 15.5px; display:block; }
.item-sub{ font-size: 11.5px; color: var(--tinta-suave); margin-top: 2px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.yo{ color: var(--azul-soft); font-weight:700; font-size: 11.5px; }

/* Píldoras de estado */
.pill{
  font-size: 11px; font-weight:700; letter-spacing:.3px;
  padding: 4px 9px; border-radius: 999px;
  background: var(--superficie-3); color: var(--tinta-suave);
  white-space:nowrap;
}
.pill.ok{ background: var(--ok-bg); color: var(--ok); }
.pill.no{ background: var(--pend-bg); color: var(--pend); }
.pill.oro{ background: rgba(255,201,64,.16); color: var(--oro); }

/* Botón toggle de estado */
.toggle{
  font-family:'Bebas Neue', sans-serif;
  font-size: 13px; letter-spacing:.8px;
  padding: 9px 14px; border-radius: 999px;
  border: 1.5px solid var(--ok); color: var(--ok);
  background: var(--ok-bg);
  cursor:pointer; min-height: 40px; white-space:nowrap;
  display:inline-flex; align-items:center;
}
.toggle.no{ border-color: var(--pend); color: var(--pend); background: var(--pend-bg); }
.toggle.off{ opacity:.35; pointer-events:none; }

/* ============ MI RESPUESTA (destacado) ============ */
.destacado{
  background: linear-gradient(150deg, rgba(59,123,240,.18), rgba(59,123,240,.05));
  border: 1.5px solid rgba(59,123,240,.5);
  border-radius: var(--radio);
  padding: 15px;
  margin-bottom: 16px;
}
.destacado .titulo{
  font-family:'Bebas Neue',sans-serif; font-size: 17px; letter-spacing:.5px;
  color:#fff; margin-bottom: 11px;
}
.destacado .row{ margin-bottom:0; }
.destacado button{ font-size: 16px; padding: 15px; }
.btn-si{ background: var(--ok); color:#06230F; }
.btn-si.inactivo{ background: var(--superficie-2); color: var(--tinta-suave); border:1px solid var(--linea); }
.btn-no{ background: var(--pend); color:#2B0605; }
.btn-no.inactivo{ background: var(--superficie-2); color: var(--tinta-suave); border:1px solid var(--linea); }

/* ============ EVENTOS (amistoso / asado) ============ */
.evento{
  background: var(--superficie-2);
  border: 1px solid var(--linea);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
}
.evento-cab{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom: 12px; }
.evento-tit{ font-weight:700; font-size: 16px; }
.evento-meta{ font-size: 12.5px; color: var(--tinta-suave); margin-top:2px; }

.tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top: 10px; }
.tag{
  font-size: 12.5px; font-weight:600;
  background: rgba(59,123,240,.18); color: var(--azul-soft);
  border: 1px solid rgba(59,123,240,.3);
  border-radius: 8px; padding: 6px 10px;
}
.tag.quitar{ cursor:pointer; }
.tag.quitar::after{ content:" ✕"; opacity:.6; }

.vacio{ font-size: 13.5px; color: var(--tinta-suave); padding: 12px 0; text-align:center; }
.aviso{
  font-size: 13px; background: rgba(242,96,88,.1);
  border-left: 3px solid var(--pend); color: #FFC9C6;
  padding: 10px 12px; border-radius: 8px; margin-bottom: 12px;
}
.aviso.info{ background: rgba(59,123,240,.1); border-left-color: var(--azul); color: var(--azul-soft); }

.separador{ font-size: 12px; color: var(--tinta-suave); text-transform:uppercase; letter-spacing:.6px; margin: 18px 0 8px; font-weight:700; }

/* ============ NAV INFERIOR ============ */
.nav{
  position: fixed; bottom:0; left:0; right:0;
  background: rgba(15,19,27,.94);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--linea);
  display:flex;
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  z-index: 40;
}
.nav-btn{
  flex:1; background:none; border:none; padding: 7px 2px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  color: var(--tinta-suave); min-height:auto; border-radius: 10px;
}
.nav-btn svg{ width:20px; height:20px; }
.nav-btn span{ font-size: 9px; font-weight:700; letter-spacing:.1px; text-transform:uppercase; }
.nav-btn.on{ color: var(--azul-soft); background: rgba(59,123,240,.1); }

.sumario{
  cursor:pointer; font-size: 13.5px; font-weight:700; color: var(--azul-soft);
  padding: 8px 0; list-style:none; user-select:none;
}
.sumario::-webkit-details-marker{ display:none; }
.sumario::before{ content:"⚙ "; }

/* ============ MODAL ============ */
.overlay{
  position:fixed; inset:0; background: rgba(6,9,14,.82);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display:flex; align-items:center; justify-content:center;
  padding: 18px; z-index: 100;
}
.modal{
  background: var(--superficie);
  border:1px solid rgba(59,123,240,.35);
  border-radius: 20px; padding: 24px 20px;
  width:100%; max-width: 400px;
  max-height: 88vh; overflow-y:auto;
}
.modal .escudo-modal{ display:flex; justify-content:center; margin-bottom: 12px; }
.modal h2{
  font-family:'Bebas Neue',sans-serif; font-size: 27px; letter-spacing:1px;
  color:#fff; margin:0; text-align:center;
}
.modal .sub{ font-size: 14px; color: var(--tinta-suave); margin: 4px 0 20px; text-align:center; }
.modal label{ font-size: 13px; font-weight:700; display:block; margin-bottom: 6px; color: var(--tinta-suave); }
.campo{ margin-bottom: 14px; }
.check{
  display:flex; align-items:center; gap: 10px; margin-bottom: 14px;
  background: var(--superficie-2); padding: 12px; border-radius: 11px;
  cursor:pointer;
}
.check input{ width:20px; height:20px; flex:0 0 auto; accent-color: var(--azul); }
.check label{ margin:0; font-size: 14.5px; color: var(--tinta); font-weight:600; cursor:pointer; }
.error{ color: var(--pend); font-size: 13px; margin-bottom: 12px; display:none; background: var(--pend-bg); padding: 9px 11px; border-radius: 9px; }

.tabs-modal{ display:flex; gap:8px; margin-bottom: 18px; }
.tabs-modal button{ flex:1; font-size: 14px; }

/* ============ NAVEGADOR DE FECHAS ============ */
.nav-fechas{
  display:flex; align-items:center; gap:10px;
  background: var(--superficie); border:1px solid var(--linea);
  border-radius: 12px; padding: 8px 10px; margin-bottom: 12px;
}
.nav-fechas button{ flex:0 0 auto; min-width:42px; font-size:20px; padding:6px 10px; }
.nav-fechas-lbl{
  flex:1; text-align:center; font-weight:700; font-size: 15px;
  display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
  text-transform: capitalize;
}

/* ============ DIFERENCIACIÓN SÁBADO / AMISTOSO ============ */
.evento.amistoso{
  border-left: 4px solid var(--ambar);
  background: linear-gradient(100deg, rgba(255,159,42,.09), var(--superficie-2) 60%);
}
.destacado.amistoso-tema{
  background: linear-gradient(150deg, rgba(255,159,42,.18), rgba(255,159,42,.05));
  border-color: rgba(255,159,42,.5);
}
.etiqueta-tipo{
  display:inline-flex; align-items:center; gap:5px;
  font-family:'Bebas Neue',sans-serif; font-size: 12px; letter-spacing:.9px;
  padding: 4px 10px; border-radius: 6px; margin-bottom: 8px;
}
.etiqueta-tipo.sabado{ background: rgba(59,123,240,.22); color: var(--azul-soft); }
.etiqueta-tipo.amistoso{ background: rgba(255,159,42,.2); color: var(--ambar); }

/* ============ RESULTADOS ============ */
.resultado-box{
  display:flex; align-items:center; justify-content:center; gap: 14px;
  background: rgba(0,0,0,.28); border-radius: 11px; padding: 12px; margin-bottom: 10px;
}
.resultado-marcador{
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size: 26px;
}
.res-pill{
  font-family:'Bebas Neue',sans-serif; font-size: 14px; letter-spacing:1px;
  padding: 6px 14px; border-radius: 8px;
}
.res-pill.gano{ background: var(--ok-bg); color: var(--ok); }
.res-pill.perdio{ background: var(--pend-bg); color: var(--pend); }
.res-pill.empate{ background: var(--superficie-3); color: var(--tinta-suave); }

.mvp-box{
  display:flex; align-items:center; gap:10px;
  background: rgba(255,201,64,.12); border:1px solid rgba(255,201,64,.3);
  border-radius: 11px; padding: 11px 13px; margin-bottom: 10px;
}
.mvp-box .estrella{ font-size: 20px; }
.mvp-box .txt{ flex:1; }
.mvp-box .lbl{ font-size: 10.5px; text-transform:uppercase; letter-spacing:.6px; color: var(--tinta-suave); font-weight:700; }
.mvp-box .nom{ font-size: 16px; font-weight:700; color: var(--oro); }

/* ============ ESTADÍSTICAS ============ */
.stat-grande{
  display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin-bottom: 16px;
}
.stat-caja{
  background: var(--superficie-2); border:1px solid var(--linea);
  border-radius: 12px; padding: 14px 8px; text-align:center;
}
.stat-caja .n{ font-family:'JetBrains Mono',monospace; font-size: 24px; font-weight:700; display:block; line-height:1; }
.stat-caja .t{ font-size: 10px; text-transform:uppercase; letter-spacing:.5px; color: var(--tinta-suave); margin-top:5px; display:block; }
.stat-caja.g .n{ color: var(--ok); }
.stat-caja.e .n{ color: var(--tinta-suave); }
.stat-caja.p .n{ color: var(--pend); }

.rank-pos{
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size: 14px;
  color: var(--tinta-suave); flex:0 0 26px;
}
.rank-pos.top{ color: var(--oro); }

/* ============ VOTACIÓN ============ */
.votacion{
  background: rgba(255,201,64,.08); border:1px solid rgba(255,201,64,.25);
  border-radius: 11px; padding: 12px 13px; margin-bottom: 10px;
}
.votacion .lbl{
  font-size: 12px; text-transform:uppercase; letter-spacing:.5px;
  color: var(--oro); font-weight:700; margin-bottom: 10px;
}
.voto-grid{ display:flex; flex-wrap:wrap; gap:7px; }
.voto-btn{
  background: var(--superficie-2); color: var(--tinta);
  border:1px solid var(--linea); border-radius: 9px;
  padding: 9px 13px; font-size: 13.5px; font-weight:600; min-height:0;
}
.voto-btn.elegido{ background: var(--oro); color:#3A2A00; border-color: var(--oro); }
.voto-hecho{ font-size: 12px; color: var(--tinta-suave); margin-top: 9px; }

/* ============ WHATSAPP ============ */
button.wsp{ background:#1FA855; color:#fff; }
button.wsp::before{ content:"💬 "; }

/* ============ LISTA DE ESPERA ============ */
.item.en-espera{ opacity:.75; }
.pill.ambar{ background: rgba(255,159,42,.18); color: var(--ambar); }
.toggle.espera{ border-color: var(--ambar); color: var(--ambar); background: rgba(255,159,42,.14); }

/* ============ EQUIPOS ============ */
.equipos-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.equipo{ border-radius:12px; padding:12px 10px; }
.eq-a{ background: rgba(59,123,240,.14); border:1px solid rgba(59,123,240,.35); }
.eq-b{ background: rgba(255,159,42,.12); border:1px solid rgba(255,159,42,.32); }
.eq-tit{
  font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:.8px;
  text-align:center; margin-bottom:9px; padding-bottom:7px;
  border-bottom:1px solid var(--linea);
}
.eq-a .eq-tit{ color: var(--azul-soft); }
.eq-b .eq-tit{ color: var(--ambar); }
.eq-jug{ font-size:13.5px; padding:5px 2px; text-align:center; font-weight:600; }

/* ============ RACHA ============ */
.racha-box{
  display:flex; align-items:center; gap:12px;
  border-radius:12px; padding:13px 15px; margin-top:4px;
}
.racha-box.gano{ background: var(--ok-bg); border:1px solid rgba(53,196,107,.3); }
.racha-box.perdio{ background: var(--pend-bg); border:1px solid rgba(242,96,88,.3); }
.racha-box.empate{ background: var(--superficie-2); border:1px solid var(--linea); }
.racha-n{ font-family:'JetBrains Mono',monospace; font-size:30px; font-weight:700; line-height:1; }
.racha-box.gano .racha-n{ color: var(--ok); }
.racha-box.perdio .racha-n{ color: var(--pend); }
.racha-t{ font-size:14px; font-weight:600; }

/* ============ RECORDATORIO / GOLEADORES ============ */
.recordatorio{
  display:flex; align-items:center; gap:10px;
  background: rgba(255,159,42,.14); border:1px solid rgba(255,159,42,.4);
  color: #FFD9A8; border-radius: 11px; padding: 12px 13px; margin-bottom: 10px;
  font-size: 13.5px;
}
.recordatorio b{ color:#fff; }
.ping{
  width:9px; height:9px; border-radius:50%; background: var(--ambar);
  flex:0 0 auto; animation: pulso 1.4s infinite;
}
@keyframes pulso{
  0%{ box-shadow:0 0 0 0 rgba(255,159,42,.6); }
  70%{ box-shadow:0 0 0 9px rgba(255,159,42,0); }
  100%{ box-shadow:0 0 0 0 rgba(255,159,42,0); }
}
.goleadores-box{
  background: rgba(53,196,107,.1); border:1px solid rgba(53,196,107,.28);
  border-radius: 11px; padding: 11px 13px; margin-bottom: 10px;
}
.goleadores-box .lbl{
  font-size: 10.5px; text-transform:uppercase; letter-spacing:.6px;
  color: var(--tinta-suave); font-weight:700; margin-bottom: 7px;
}

/* ============ INFO DEL PARTIDO ============ */
.info-partido{
  background: rgba(0,0,0,.25);
  border-radius: 11px;
  padding: 12px 14px;
  margin-bottom: 12px;
}
.info-hora{
  font-family:'Bebas Neue',sans-serif;
  font-size: 30px; letter-spacing:1px; line-height:1;
  color: var(--oro); margin-bottom: 6px;
}
.info-linea{ font-size: 13.5px; color: var(--tinta); margin-top: 3px; }

/* ============ FILAS DE DETALLE (modal) ============ */
.detalle-filas{ margin-top: 4px; }
.det-fila{
  display:flex; justify-content:space-between; align-items:center; gap:12px;
  padding: 11px 0; border-bottom:1px solid var(--linea);
}
.det-fila:last-child{ border-bottom:none; }
.det-lbl{ font-size: 13px; color: var(--tinta-suave); font-weight:600; }
.det-val{ font-size: 15px; font-weight:700; text-align:right; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="header-top">

<script>
// ======= CONFIGURACIÓN DE FIREBASE =======
const firebaseConfig = {
  apiKey: "AIzaSyA1m-4f1tg0uffUfPKSQBB5kyFoGGSNo3w",
  authDomain: "urracas-fe915.firebaseapp.com",
  databaseURL: "https://urracas-fe915-default-rtdb.firebaseio.com",

};
firebase.initializeApp(firebaseConfig);
const equipoRef = firebase.database().ref("equipo-la-u");
// ==========================================

const PERSONAL_KEY = "mi-perfil-la-u";
const CODIGO_CAPITAN = "LAU-CAPITAN";

let data = {
  jugadores: [], admins: [],
  fechaCuotaActual: null, fechasCuota: [],
  cuota: {}, sabados: {}, sabadoConfig: {}, amistosos: [], asados: [],
  montoCuota: "", gastos: []
};
let miPerfil = null;

function uid(){ return Math.random().toString(36).slice(2,9); }
function proximoSabado(){
  const d = new Date();
  const diff = (6 - d.getDay() + 7) % 7 || 7;
  const s = new Date(d);
  s.setDate(d.getDate() + (d.getDay()===6 ? 0 : diff));
  return s.toISOString().slice(0,10);
}
function fechaLinda(iso){
  if(!iso) return "";
  const [a,m,d] = iso.split("-");
  return `${d}/${m}`;
}
function nombreDe(id){
  const j = data.jugadores.find(x=>x.id===id);
  return j ? j.nombre : "(?)";
}
function esAdmin(id){ return data.admins.includes(id); }
function soyCapitan(){ return miPerfil && esAdmin(miPerfil.id); }
function fechaCuotaVigente(){
  return data.fechasCuota.length ? data.fechasCuota[data.fechasCuota.length-1] : null;
}
function etiquetaFecha(id){
  const i = data.fechasCuota.indexOf(id);
  return i >= 0 ? "Fecha " + (i+1) : "Fecha ?";
}
function estadoCuota(fecha, pid){
  if(!fecha) return {declarado:false, confirmado:false};
  if(!data.cuota[fecha]) data.cuota[fecha] = {};
  const a = data.cuota[fecha][pid];
  if(!a || typeof a !== "object") data.cuota[fecha][pid] = {declarado:false, confirmado:false};
  return data.cuota[fecha][pid];
}
function partidosJugados(pid){
  return Object.values(data.sabados||{}).filter(a=>Array.isArray(a)&&a.includes(pid)).length;
}
function cuotaAlDia(pid){
  // Usa la MISMA fecha que la pestaña Cuota, para que confirmar un pago
  // habilite al jugador inmediatamente en la pestaña Sábado.
  const f = data.fechaCuotaActual || fechaCuotaVigente();
  return f ? estadoCuota(f, pid).confirmado : false;
}

// Sábado que se está viendo. Por defecto el próximo, pero se puede navegar.
let sabadoVisto = null;
function sabadoActivo(){
  if(!sabadoVisto) sabadoVisto = proximoSabado();
  return sabadoVisto;
}
function sabadosConHistorial(){
  const set = new Set(Object.keys(data.sabados||{}).filter(k=>{
    const a = data.sabados[k];
    return Array.isArray(a) && a.length;
  }));
  set.add(proximoSabado());
  set.add(sabadoActivo());
  return Array.from(set).sort();
}
function moverSabado(dias){
  const d = new Date(sabadoActivo()+"T12:00:00");
  d.setDate(d.getDate()+dias);
  sabadoVisto = d.toISOString().slice(0,10);
}

// ---------- CONFIG DEL PARTIDO DEL SÁBADO ----------
const LUGARES = ["Tribunales", "Taborín", "Otro"];
const CUPO_INTERNO = 14;

function configSabado(fecha){
  if(!data.sabadoConfig[fecha] || typeof data.sabadoConfig[fecha] !== "object"){
    data.sabadoConfig[fecha] = { hora:"", lugar:"Tribunales", lugarOtro:"", modo:"interno", rival:"" };
  }
  const c = data.sabadoConfig[fecha];
  if(!c.lugar) c.lugar = "Tribunales";
  if(!c.modo) c.modo = "interno";
  if(c.hora === undefined) c.hora = "";
  if(c.lugarOtro === undefined) c.lugarOtro = "";
  if(c.rival === undefined) c.rival = "";
  return c;
}
function textoLugar(c){
  return c.lugar === "Otro" ? (c.lugarOtro || "A confirmar") : c.lugar;
}
function textoModo(c){
  return c.modo === "interno" ? "Entre nosotros" : (c.rival ? "vs " + c.rival : "Contra otro equipo");
}

// ---------- RESULTADOS Y MVP ----------
function normalizarResultado(o){
  if(o.resultado === undefined) o.resultado = "";   // "gano" | "perdio" | "empate" | ""
  if(o.golesF === undefined) o.golesF = "";
  if(o.golesC === undefined) o.golesC = "";
  if(o.mvp === undefined) o.mvp = "";
  if(!o.votosMvp || typeof o.votosMvp !== "object") o.votosMvp = {};
  if(!Array.isArray(o.goleadores)) o.goleadores = []; // [{jugadorId, goles}]
  return o;
}

// ¿Ya pasó el partido + 90 min y falta cargar el resultado?
function partidoTerminado(fecha, hora){
  if(!fecha) return false;
  const h = hora && /^\d{2}:\d{2}$/.test(hora) ? hora : "20:00";
  const inicio = new Date(fecha + "T" + h + ":00");
  if(isNaN(inicio.getTime())) return false;
  return Date.now() >= inicio.getTime() + 90*60*1000;
}
function golesDe(pid){
  let n = 0;
  Object.keys(data.sabadoConfig||{}).forEach(f=>{
    const c = data.sabadoConfig[f];
    if(c && Array.isArray(c.goleadores)){
      c.goleadores.forEach(g=>{ if(g.jugadorId===pid) n += Number(g.goles)||0; });
    }
  });
  (data.amistosos||[]).forEach(a=>{
    if(Array.isArray(a.goleadores)) a.goleadores.forEach(g=>{ if(g.jugadorId===pid) n += Number(g.goles)||0; });
  });
  return n;
}

// ---------- VOTACIÓN DE LA FIGURA ----------
function ganadorMvp(obj){
  const votos = (obj && obj.votosMvp) || {};
  const conteo = {};
  Object.values(votos).forEach(v=>{ if(v) conteo[v] = (conteo[v]||0)+1; });
  let mejor = null, max = 0, empate = false;
  Object.keys(conteo).forEach(id=>{
    if(conteo[id] > max){ max = conteo[id]; mejor = id; empate = false; }
    else if(conteo[id] === max){ empate = true; }
  });
  if(!mejor) return null;
  return { id: mejor, votos: max, total: Object.keys(votos).length, empate };
}
function mvpsDe(pid){
  let n = 0;
  Object.keys(data.sabadoConfig||{}).forEach(f=>{
    const g = ganadorMvp(data.sabadoConfig[f]);
    if(g && g.id === pid) n++;
  });
  (data.amistosos||[]).forEach(a=>{
    const g = ganadorMvp(a);
    if(g && g.id === pid) n++;
  });
  return n;
}

// ---------- LISTA DE ESPERA ----------
// Los primeros `cupo` de la lista son titulares; el resto queda en espera
// y asciende solo cuando alguien se baja.
function separarCupo(lista, cupo){
  if(cupo === null) return { titulares: lista.slice(), espera: [] };
  return { titulares: lista.slice(0, cupo), espera: lista.slice(cupo) };
}

// ---------- ARMADO DE EQUIPOS ----------
function armarEquipos(ids){
  // Reparte alternando por presentismo para que queden parejos
  const orden = ids.slice().sort((a,b)=>presenciasTotales(b)-presenciasTotales(a));
  const A = [], B = [];
  orden.forEach((id,i)=>{
    // patrón serpenteante: A,B,B,A,A,B,B,A...
    const bloque = Math.floor(i/2) % 2;
    if((i%2===0) === (bloque===0)) A.push(id); else B.push(id);
  });
  return { a:A, b:B };
}

// ---------- CAJA ----------
function totalRecaudado(){
  const monto = Number(data.montoCuota) || 0;
  if(!monto) return 0;
  let pagos = 0;
  Object.keys(data.cuota||{}).forEach(f=>{
    Object.values(data.cuota[f]||{}).forEach(e=>{ if(e && e.confirmado) pagos++; });
  });
  return pagos * monto;
}
function totalGastos(){
  return (data.gastos||[]).reduce((s,g)=>s + (Number(g.monto)||0), 0);
}
function plata(n){
  return "$" + (Number(n)||0).toLocaleString('es-AR');
}

// ---------- RACHAS Y RÉCORDS ----------
function rachaActual(){
  const p = todosLosPartidos(); // ya viene ordenado del más nuevo al más viejo
  if(!p.length) return null;
  const tipo = p[0].cfg.resultado;
  let n = 0;
  for(const x of p){ if(x.cfg.resultado === tipo) n++; else break; }
  return { tipo, n };
}
function rachaAsistencia(pid){
  // Cuántas convocatorias seguidas (de la más reciente hacia atrás) estuvo
  const fechas = Object.keys(data.sabados||{})
    .filter(f=>Array.isArray(data.sabados[f]) && data.sabados[f].length)
    .sort().reverse();
  let n = 0;
  for(const f of fechas){ if(data.sabados[f].includes(pid)) n++; else break; }
  return n;
}
function etiquetaResultado(r){
  return r==="gano" ? "GANAMOS" : r==="perdio" ? "PERDIMOS" : r==="empate" ? "EMPATAMOS" : "";
}
function claseResultado(r){
  return r==="gano" ? "gano" : r==="perdio" ? "perdio" : "empate";
}

// Devuelve todos los partidos con resultado cargado (sábados + amistosos)
function todosLosPartidos(){
  const out = [];
  Object.keys(data.sabadoConfig||{}).forEach(f=>{
    const c = normalizarResultado(configSabado(f));
    if(c.resultado) out.push({tipo:"sabado", fecha:f, cfg:c, plantel:(data.sabados[f]||[])});
  });
  (data.amistosos||[]).forEach(am=>{
    const a = normalizarResultado(am);
    if(a.resultado) out.push({tipo:"amistoso", fecha:am.fecha, cfg:a, plantel:(am.anotados||[])});
  });
  return out.sort((a,b)=>b.fecha.localeCompare(a.fecha));
}
function balanceEquipo(){
  const p = todosLosPartidos();
  return {
    g: p.filter(x=>x.cfg.resultado==="gano").length,
    e: p.filter(x=>x.cfg.resultado==="empate").length,
    p: p.filter(x=>x.cfg.resultado==="perdio").length,
    total: p.length
  };
}
function presenciasTotales(pid){
  let n = Object.values(data.sabados||{}).filter(a=>Array.isArray(a)&&a.includes(pid)).length;
  n += (data.amistosos||[]).filter(a=>Array.isArray(a.anotados)&&a.anotados.includes(pid)).length;
  return n;
}
// Construye el bloque de resultado + MVP para un partido (sábado o amistoso)
function bloqueResultado(obj, plantel, onGuardar, fechaPartido, horaPartido){
  const cont = document.createElement("div");
  normalizarResultado(obj);

  if(obj.resultado){
    const box = document.createElement("div");
    box.className = "resultado-box";
    box.innerHTML = `<span class="res-pill ${claseResultado(obj.resultado)}">${etiquetaResultado(obj.resultado)}</span>` +
      ((obj.golesF!=="" && obj.golesC!=="") ? `<span class="resultado-marcador">${obj.golesF} - ${obj.golesC}</span>` : "");
    cont.appendChild(box);
  }
  const gan = ganadorMvp(obj);
  const puedeVotar = partidoTerminado(fechaPartido, horaPartido) &&
                     plantel.includes(miPerfil.id) && plantel.length > 1;
  const miVoto = (obj.votosMvp || {})[miPerfil.id] || "";

  if(gan){
    const m = document.createElement("div");
    m.className = "mvp-box";
    m.innerHTML = `<span class="estrella">⭐</span>
      <div class="txt">
        <div class="lbl">Figura del partido${gan.empate?" (empate)":""}</div>
        <div class="nom">${nombreDe(gan.id)}</div>
      </div>
      <span class="pill oro">${gan.votos}/${gan.total} votos</span>`;
    cont.appendChild(m);
  }

  // Votación abierta
  if(puedeVotar){
    const vot = document.createElement("div");
    vot.className = "votacion";
    vot.innerHTML = `<div class="lbl">⭐ ¿Quién fue la figura?</div>`;
    const grid = document.createElement("div");
    grid.className = "voto-grid";
    plantel.filter(id=>id!==miPerfil.id).forEach(id=>{
      const b = document.createElement("button");
      b.className = "voto-btn" + (miVoto===id ? " elegido" : "");
      b.textContent = nombreDe(id);
      b.onclick = async ()=>{
        if(!obj.votosMvp) obj.votosMvp = {};
        if(obj.votosMvp[miPerfil.id] === id) delete obj.votosMvp[miPerfil.id];
        else obj.votosMvp[miPerfil.id] = id;
        await onGuardar();
      };
      grid.appendChild(b);
    });
    vot.appendChild(grid);
    if(miVoto){
      const p = document.createElement("div");
      p.className = "voto-hecho";
      p.textContent = `Votaste a ${nombreDe(miVoto)}. Tocá de nuevo para cambiar.`;
      vot.appendChild(p);
    }
    cont.appendChild(vot);
  }

  if(obj.goleadores.length){
    const g = document.createElement("div");
    g.className = "goleadores-box";
    g.innerHTML = `<div class="lbl">⚽ Goles</div>` +
      `<div class="tags">${obj.goleadores.map(x=>`<span class="tag">${nombreDe(x.jugadorId)}${Number(x.goles)>1?" ×"+x.goles:""}</span>`).join("")}</div>`;
    cont.appendChild(g);
  }

  if(soyCapitan()){
    const det = document.createElement("details");
    const pendiente = !obj.resultado && partidoTerminado(fechaPartido, horaPartido);
    if(pendiente) det.open = true;
    det.style.marginTop = "6px";
    if(pendiente){
      const rec = document.createElement("div");
      rec.className = "recordatorio";
      rec.innerHTML = `<span class="ping"></span><div>El partido ya terminó. <b>Cargá el resultado y los goles.</b></div>`;
      cont.insertBefore(rec, cont.firstChild);
    }
    det.innerHTML = `<summary class="sumario">${obj.resultado ? "Editar resultado" : "Cargar resultado y goles"}</summary>`;
    const cuerpo = document.createElement("div");
    cuerpo.style.paddingTop = "10px";

    const rR = document.createElement("div"); rR.className="row";
    const selR = document.createElement("select");
    selR.innerHTML = `
      <option value="">Sin cargar</option>
      <option value="gano"${obj.resultado==="gano"?" selected":""}>Ganamos</option>
      <option value="empate"${obj.resultado==="empate"?" selected":""}>Empatamos</option>
      <option value="perdio"${obj.resultado==="perdio"?" selected":""}>Perdimos</option>`;
    rR.appendChild(selR);
    cuerpo.appendChild(rR);

    const rG = document.createElement("div"); rG.className="row";
    const inF = document.createElement("input");
    inF.type="number"; inF.inputMode="numeric"; inF.placeholder="Nuestros"; inF.value = obj.golesF;
    const inC = document.createElement("input");
    inC.type="number"; inC.inputMode="numeric"; inC.placeholder="De ellos"; inC.value = obj.golesC;
    rG.appendChild(inF); rG.appendChild(inC);
    cuerpo.appendChild(rG);

    const lista = plantel.length ? plantel : data.jugadores.map(j=>j.id);

    // ---- Goleadores ----
    const sepG = document.createElement("div");
    sepG.className = "separador";
    sepG.textContent = "⚽ Goleadores";
    cuerpo.appendChild(sepG);

    const listaG = document.createElement("div");
    listaG.className = "tags";
    const pintarGoleadores = ()=>{
      listaG.innerHTML = "";
      if(!obj.goleadores.length){
        listaG.innerHTML = `<span class="vacio" style="padding:4px 0;">Nadie cargado.</span>`;
      }
      obj.goleadores.forEach((g,i)=>{
        const t = document.createElement("span");
        t.className = "tag quitar";
        t.textContent = nombreDe(g.jugadorId) + (Number(g.goles)>1 ? " ×"+g.goles : "");
        t.onclick = ()=>{ obj.goleadores.splice(i,1); pintarGoleadores(); };
        listaG.appendChild(t);
      });
    };
    pintarGoleadores();
    cuerpo.appendChild(listaG);

    const rG2 = document.createElement("div"); rG2.className="row"; rG2.style.marginTop="8px";
    const selG = document.createElement("select");
    selG.innerHTML = `<option value="">Quién hizo gol...</option>` +
      lista.map(id=>`<option value="${id}">${nombreDe(id)}</option>`).join("");
    const inCant = document.createElement("input");
    inCant.type="number"; inCant.inputMode="numeric"; inCant.min="1"; inCant.value="1";
    inCant.style.flex="0 0 70px";
    const bAddG = document.createElement("button");
    bAddG.className="ghost mini"; bAddG.textContent="+"; bAddG.style.flex="0 0 auto";
    bAddG.onclick = ()=>{
      if(!selG.value) return;
      const cant = Math.max(1, Number(inCant.value)||1);
      const ya = obj.goleadores.find(x=>x.jugadorId===selG.value);
      if(ya) ya.goles = (Number(ya.goles)||0) + cant;
      else obj.goleadores.push({jugadorId:selG.value, goles:cant});
      selG.value=""; inCant.value="1";
      pintarGoleadores();
    };
    rG2.appendChild(selG); rG2.appendChild(inCant); rG2.appendChild(bAddG);
    cuerpo.appendChild(rG2);

    const bG = document.createElement("button");
    bG.className="full"; bG.textContent="Guardar resultado";
    bG.onclick = async ()=>{
      obj.resultado = selR.value;
      obj.golesF = inF.value;
      obj.golesC = inC.value;
      await onGuardar();
    };
    cuerpo.appendChild(bG);
    det.appendChild(cuerpo);
    cont.appendChild(det);
  }
  return cont;
}

// ---------- STORAGE ----------
function cargarPersonal(){
  try{ const r = localStorage.getItem(PERSONAL_KEY); if(r) miPerfil = JSON.parse(r); }
  catch(e){ miPerfil = null; }
}
function guardarPersonal(){
  try{ localStorage.setItem(PERSONAL_KEY, JSON.stringify(miPerfil)); }catch(e){}
}
function cerrarSesion(){
  try{ localStorage.removeItem(PERSONAL_KEY); }catch(e){}
  miPerfil = null;
  mostrarModal();
}
async function guardar(){
  try{ await equipoRef.set(data); }
  catch(e){ console.error("Error guardando en Firebase:", e); }
}
function sanitizar(){
  // Firebase elimina arrays/objetos vacíos: hay que reponerlos al leer.
  if(!Array.isArray(data.jugadores)) data.jugadores = [];
  if(!Array.isArray(data.admins)) data.admins = [];
  if(!Array.isArray(data.fechasCuota)) data.fechasCuota = [];
  if(!data.cuota || typeof data.cuota!=="object") data.cuota = {};
  if(!data.sabados || typeof data.sabados!=="object") data.sabados = {};
  if(!data.sabadoConfig || typeof data.sabadoConfig!=="object") data.sabadoConfig = {};
  Object.values(data.sabadoConfig).forEach(c=>{
    if(c && typeof c==="object" && !Array.isArray(c.goleadores)) c.goleadores = [];
  });
  if(!Array.isArray(data.amistosos)) data.amistosos = [];
  data.amistosos.forEach(a=>{
    if(!Array.isArray(a.anotados)) a.anotados = [];
    if(!Array.isArray(a.goleadores)) a.goleadores = [];
  });
  if(!Array.isArray(data.asados)) data.asados = [];
  data.asados.forEach(a=>{ if(!Array.isArray(a.aportes)) a.aportes = []; });
  if(!Array.isArray(data.gastos)) data.gastos = [];
  if(data.montoCuota === undefined || data.montoCuota === null) data.montoCuota = "";
}
function arrancar(){
  cargarPersonal();
  equipoRef.on("value", snap=>{
    const v = snap.val();
    if(v) data = Object.assign(data, v);
    sanitizar();
    if(!data.fechasCuota.length){ data.fechasCuota.push(uid()); }
    if(!data.fechaCuotaActual || !data.fechasCuota.includes(data.fechaCuotaActual)){
      data.fechaCuotaActual = fechaCuotaVigente();
    }
    // Si mi perfil ya no existe en el plantel, pido volver a identificarse
    if(miPerfil && !data.jugadores.find(j=>j.id===miPerfil.id)){
      miPerfil = null;
      try{ localStorage.removeItem(PERSONAL_KEY); }catch(e){}
    }
    if(!miPerfil){ mostrarModal(); }
    else { document.getElementById("modal-root").innerHTML=""; render(); }
  }, err=>{
    console.error("Error leyendo Firebase:", err);
  });
}

    rLO.appendChild(inLO);
    cfg.appendChild(rLO);

    inR.type="text"; inR.placeholder="Nombre del rival"; inR.value = c.rival || "";

  bWsp.className = "wsp full";
  bWsp.innerHTML = "Compartir al grupo de WhatsApp";
  bWsp.style.marginBottom = "12px";
  bWsp.onclick = ()=>{
    let txt = `⚽ *URRACAS* — Sábado ${fechaLinda(sab)}\n`;
    txt += `🕐 ${c.hora ? c.hora + " hs" : "Hora a confirmar"}\n`;
    txt += `📍 ${textoLugar(c)}\n`;
    txt += `🆚 ${textoModo(c)}\n\n`;
    txt += `*Van (${titulares.length}${cupo ? "/"+cupo : ""}):*\n`;
    txt += titulares.length ? titulares.map((id,i)=>`${i+1}. ${nombreDe(id)}`).join("\n") : "Nadie todavía";
    if(espera.length){
      txt += `\n\n*En espera:*\n` + espera.map((id,i)=>`${i+1}. ${nombreDe(id)}`).join("\n");
    }
    const faltan = data.jugadores.filter(j=>!conf.includes(j.id));
    if(faltan.length){
      txt += `\n\n*Falta que confirmen:* ` + faltan.map(j=>j.nombre).join(", ");

    window.open("https://wa.me/?text=" + encodeURIComponent(txt), "_blank");
  };
  card.appendChild(bWsp);

  const ul = document.createElement("ul");
  ul.className = "lista";
  if(!data.jugadores.length){ ul.innerHTML = `<li class="vacio">Sin jugadores.</li>`; }
  const orden = data.jugadores.slice().sort((a,b)=>{

    if(ia === -1) return 1;
    if(ib === -1) return -1;
    return ia - ib;

  orden.forEach(j=>{
    const va = conf.includes(j.id);
    const enEspera = espera.includes(j.id);

      t.onclick = async ()=>{
        if(va) data.sabados[sab] = conf.filter(i=>i!==j.id);
        else conf.push(j.id);
        await guardar(); render();
      };
    }
    li.appendChild(t);

  });

          <div class="eq-tit">Equipo A</div>
          ${c.equipos.a.map(id=>`<div class="eq-jug">${nombreDe(id)}</div>`).join("")}
        </div>
        <div class="equipo eq-b">
          <div class="eq-tit">Equipo B</div>
          ${c.equipos.b.map(id=>`<div class="eq-jug">${nombreDe(id)}</div>`).join("")}
        </div>`;
      ce.appendChild(grid);
      const bW2 = document.createElement("button");
      bW2.className = "wsp full"; bW2.textContent = "Compartir equipos";
      bW2.style.marginTop = "10px";

        let t = `⚽ *URRACAS* — Equipos del ${fechaLinda(sab)}\n\n`;

        window.open("https://wa.me/?text=" + encodeURIComponent(t), "_blank");
      };
      ce.appendChild(bW2);
    }
    if(soyCapitan()){
      const bArmar = document.createElement("button");
      bArmar.className = "ghost full";
      bArmar.textContent = c.equipos ? "Volver a mezclar" : "Armar equipos";
      bArmar.style.marginTop = "10px";
      bArmar.onclick = async ()=>{
        c.equipos = armarEquipos(titulares);
        await guardar(); render();
      };
      ce.appendChild(bArmar);
    }
    w.appendChild(ce);
  }
  return w;
}

// ---------- CUOTA ----------
function vCuota(){
  const w = document.createElement("div");

  // Recordatorio si YO debo la cuota
  if(!cuotaAlDia(miPerfil.id)){
    const rec = document.createElement("div");
    rec.className = "recordatorio";
    const e = estadoCuota(data.fechaCuotaActual, miPerfil.id);
    rec.innerHTML = `<span class="ping"></span><div>${e.declarado
      ? "Ya avisaste que pagaste. <b>Falta que el capitán lo confirme.</b>"
      : "<b>Debés la cuota.</b> Pagá y marcá abajo que ya lo hiciste."}</div>`;
    w.appendChild(rec);
  }

  const card = document.createElement("div");
  card.className = "card";
  const fa = data.fechaCuotaActual;
  card.innerHTML = `<h2>Cuota — ${etiquetaFecha(fa)}</h2>
    <p class="hint">Marcá si pagaste. El capitán confirma.</p>`;

  const row = document.createElement("div");
  row.className = "row";
  const sel = document.createElement("select");
  data.fechasCuota.forEach(f=>{
    const o = document.createElement("option");
    o.value=f; o.textContent=etiquetaFecha(f);
    if(f===fa) o.selected=true;
    sel.appendChild(o);
  });
  sel.onchange = async ()=>{ data.fechaCuotaActual = sel.value; await guardar(); render(); };
  row.appendChild(sel);
  const bN = document.createElement("button");
  bN.className="ghost mini"; bN.textContent="+ Nueva";
  bN.style.flex="0 0 auto";
  bN.onclick = async ()=>{
    const n = uid();
    data.fechasCuota.push(n);
    data.fechaCuotaActual = n;
    await guardar(); render();
  };
  row.appendChild(bN);
  card.appendChild(row);

  if(!data.jugadores.length){
    card.innerHTML += `<p class="vacio">Sin jugadores.</p>`;
    w.appendChild(card); return w;
  }

  const pend = data.jugadores.filter(j=>!estadoCuota(fa,j.id).confirmado);
  const conf = data.jugadores.filter(j=>estadoCuota(fa,j.id).confirmado);

  const ul = document.createElement("ul");
  ul.className="lista";
  if(!pend.length) ul.innerHTML = `<li class="vacio">Todos confirmados 🙌</li>`;
  pend.forEach(j=>{
    const e = estadoCuota(fa, j.id);
    const yo = j.id===miPerfil.id;
    const li = document.createElement("li");
    li.className="item";
    li.innerHTML = `<div class="item-main">
        <span class="item-nom">${j.nombre}${yo?' <span class="yo">(vos)</span>':''}</span>
      </div>`;
    // Declaración: solo uno mismo
    if(yo){
      const t = document.createElement("span");
      t.className = "toggle" + (e.declarado ? "" : " no");
      t.textContent = e.declarado ? "PAGUÉ" : "NO PAGUÉ";
      t.onclick = async ()=>{ e.declarado = !e.declarado; await guardar(); render(); };
      li.appendChild(t);
    } else {
      const p = document.createElement("span");
      p.className = "pill" + (e.declarado ? " oro" : "");
      p.textContent = e.declarado ? "dice que pagó" : "no pagó";
      li.appendChild(p);
    }
    // Confirmación: solo capitán
    if(soyCapitan()){
      const b = document.createElement("button");
      b.className="mini"; b.textContent="OK";
      b.onclick = async ()=>{ e.confirmado = true; await guardar(); render(); };
      li.appendChild(b);
    }
    ul.appendChild(li);
  });
  card.appendChild(ul);

  if(conf.length){
    const sep = document.createElement("div");
    sep.className="separador";
    sep.textContent = `✅ Confirmados (${conf.length})`;
    card.appendChild(sep);
    const tags = document.createElement("div");
    tags.className="tags";
    conf.forEach(j=>{
      const t = document.createElement("span");
      t.className = "tag" + (soyCapitan() ? " quitar":"");
      t.textContent = j.nombre;
      if(soyCapitan()) t.onclick = async ()=>{
        estadoCuota(fa,j.id).confirmado = false;
        await guardar(); render();
      };
      tags.appendChild(t);
    });
    card.appendChild(tags);
  }
  w.appendChild(card);

  // ===== CAJA DEL CLUB =====
  const caja = document.createElement("div");
  caja.className = "card";
  const rec = totalRecaudado(), gas = totalGastos(), saldo = rec - gas;
  caja.innerHTML = `<h2>💰 Caja del club</h2>
    <p class="hint">${data.montoCuota ? "Cuota de " + plata(data.montoCuota) + " por jugador" : "Cargá cuánto sale la cuota para calcular lo recaudado"}</p>
    <div class="stat-grande">
      <div class="stat-caja g"><span class="n">${plata(rec)}</span><span class="t">Recaudado</span></div>
      <div class="stat-caja p"><span class="n">${plata(gas)}</span><span class="t">Gastos</span></div>
      <div class="stat-caja ${saldo>=0?"g":"p"}"><span class="n">${plata(saldo)}</span><span class="t">Saldo</span></div>
    </div>`;

  if(soyCapitan()){
    const rMonto = document.createElement("div"); rMonto.className="row";
    const inMonto = document.createElement("input");
    inMonto.type="number"; inMonto.inputMode="numeric";
    inMonto.placeholder="¿Cuánto sale la cuota?"; inMonto.value = data.montoCuota;
    const bMonto = document.createElement("button");
    bMonto.className="ghost mini"; bMonto.textContent="Guardar"; bMonto.style.flex="0 0 auto";
    bMonto.onclick = async ()=>{ data.montoCuota = inMonto.value; await guardar(); render(); };
    rMonto.appendChild(inMonto); rMonto.appendChild(bMonto);
    caja.appendChild(rMonto);

    const sepG = document.createElement("div");
    sepG.className="separador"; sepG.textContent="Cargar un gasto";
    caja.appendChild(sepG);
    const rG = document.createElement("div"); rG.className="row";
    const inC = document.createElement("input");
    inC.type="text"; inC.placeholder="Concepto (cancha, pelota...)";
    const inM = document.createElement("input");
    inM.type="number"; inM.inputMode="numeric"; inM.placeholder="$"; inM.style.flex="0 0 90px";
    rG.appendChild(inC); rG.appendChild(inM);
    caja.appendChild(rG);
    const bG = document.createElement("button");
    bG.className="full"; bG.textContent="Agregar gasto";
    bG.onclick = async ()=>{
      const concepto = inC.value.trim(), monto = Number(inM.value)||0;
      if(!concepto || !monto){ alert("Poné concepto y monto."); return; }
      data.gastos.push({id:uid(), concepto, monto, fecha:new Date().toISOString().slice(0,10)});
      await guardar(); render();
    };
    caja.appendChild(bG);
  }

  if(data.gastos.length){
    const sepL = document.createElement("div");
    sepL.className="separador"; sepL.textContent="Gastos cargados";
    caja.appendChild(sepL);
    const ulG = document.createElement("ul");
    ulG.className="lista";
    data.gastos.slice().reverse().forEach(g=>{
      const li = document.createElement("li");
      li.className="item";
      li.innerHTML = `<div class="item-main">
          <span class="item-nom">${g.concepto}</span>
          <span class="item-sub">${fechaLinda(g.fecha)}</span>
        </div>
        <span class="pill no">-${plata(g.monto)}</span>`;
      if(soyCapitan()){
        const x = document.createElement("button");
        x.className="ghost mini"; x.textContent="✕";
        x.onclick = async ()=>{
          data.gastos = data.gastos.filter(y=>y.id!==g.id);
          await guardar(); render();
        };
        li.appendChild(x);
      }
      ulG.appendChild(li);
    });
    caja.appendChild(ulG);
  }
  w.appendChild(caja);
  return w;
}

  };
  const b = document.createElement("button");
  b.className="full"; b.textContent="Crear amistoso";
  b.onclick = async ()=>{
    const rival = document.getElementById("am-rival").value.trim();
    const fecha = document.getElementById("am-fecha").value;
    const hora = document.getElementById("am-hora").value;
    const lugarSel = document.getElementById("am-lugar").value;
    const lugarOtro = document.getElementById("am-lugar-otro").value.trim();
    const cancha = lugarSel==="Otro" ? (lugarOtro || "A confirmar") : lugarSel;
    if(!rival || !fecha){ alert("Poné al menos rival y fecha."); return; }
    data.amistosos.push({id:uid(), rival, fecha, hora, cancha, anotados:[]});
    await guardar(); render();
  };
  card.appendChild(b);
  w.appendChild(card);

  const lc = document.createElement("div");
  lc.className="card";
  lc.innerHTML = `<h2>Próximos</h2>`;
  const ord = data.amistosos.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(!ord.length) lc.innerHTML += `<p class="vacio">No hay amistosos.</p>`;
  ord.forEach(am=>{
    const ev = document.createElement("div");
    ev.className="evento amistoso";
    ev.innerHTML = `<span class="etiqueta-tipo amistoso">🤝 AMISTOSO</span>
      <div class="evento-cab">
        <div>
          <div class="evento-tit">vs ${am.rival}</div>
          <div class="evento-meta">${fechaLinda(am.fecha)}${am.hora?" · "+am.hora+" hs":""}${am.cancha?" · "+am.cancha:""}</div>
        </div>
        <span class="pill">${am.anotados.length} anotados</span>
      </div>`;
    ev.appendChild(bloqueResultado(am, am.anotados, async ()=>{ await guardar(); render(); }, am.fecha, am.hora));
    const bDet = document.createElement("button");
    bDet.className="ghost mini full";
    bDet.textContent="Ver detalle";
    bDet.style.marginBottom="8px";
    bDet.onclick = ()=>{
      abrirDetalle({
        titulo: "AMISTOSO",
        sub: "vs " + am.rival,
        filas: [
          {lbl:"Fecha", val: new Date(am.fecha+"T12:00:00").toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})},
          {lbl:"Hora", val: am.hora ? am.hora + " hs" : "A confirmar"},
          {lbl:"Lugar", val: am.cancha || "A confirmar"},
          {lbl:"Anotados", val: String(am.anotados.length)}
        ],
        anotados: am.anotados.map(id=>nombreDe(id))
      });
    };
    ev.appendChild(bDet);
    const bWA = document.createElement("button");
    bWA.className="wsp mini full";
    bWA.textContent="Compartir al grupo";
    bWA.style.marginBottom="8px";
    bWA.onclick = ()=>{
      let t = `🤝 *AMISTOSO* — Urracas vs ${am.rival}\n`;
      t += `📅 ${fechaLinda(am.fecha)}${am.hora?"  🕐 "+am.hora+" hs":""}\n`;
      t += `📍 ${am.cancha || "A confirmar"}\n\n`;
      t += `*Anotados (${am.anotados.length}):*\n`;
      t += am.anotados.length ? am.anotados.map((id,i)=>`${i+1}. ${nombreDe(id)}`).join("\n") : "Nadie todavía";
      window.open("https://wa.me/?text=" + encodeURIComponent(t), "_blank");
    };
    ev.appendChild(bWA);
    const yoAnotado = am.anotados.includes(miPerfil.id);
    const bA = document.createElement("button");
    bA.className = "full" + (yoAnotado ? " danger" : "");
    bA.textContent = yoAnotado ? "Bajarme" : "Anotarme";
    bA.onclick = async ()=>{
      if(yoAnotado) am.anotados = am.anotados.filter(i=>i!==miPerfil.id);
      else am.anotados.push(miPerfil.id);
      await guardar(); render();
    };
    ev.appendChild(bA);
    if(am.anotados.length){
      const tg = document.createElement("div");
      tg.className="tags";
      am.anotados.forEach(id=>{
        const t = document.createElement("span");
        t.className="tag" + (soyCapitan()?" quitar":"");
        t.textContent = nombreDe(id);
        if(soyCapitan()) t.onclick = async ()=>{
          am.anotados = am.anotados.filter(x=>x!==id);
          await guardar(); render();
        };
        tg.appendChild(t);
      });
      ev.appendChild(tg);
    }
    const bD = document.createElement("button");
    bD.className="danger mini"; bD.textContent="Borrar amistoso";
    bD.style.marginTop="10px";
    bD.onclick = async ()=>{
      if(!confirm(`¿Borrar el amistoso vs ${am.rival}?`)) return;
      data.amistosos = data.amistosos.filter(x=>x.id!==am.id);
      await guardar(); render();
    };
    ev.appendChild(bD);
    lc.appendChild(ev);
  });
  w.appendChild(lc);
  return w;
}

      <div class="item-main"><span class="item-nom">${j.nombre}</span></div>

    c4.innerHTML = `<h2>Historial</h2>`;

      const ev = document.createElement("div");

        <div class="evento-cab">
          <div>
            <div class="evento-tit">${titulo}</div>
            <div class="evento-meta">${fechaLinda(p.fecha)}${mvpP?" · ⭐ "+nombreDe(mvpP.id):""}</div>

          <span class="res-pill ${claseResultado(p.cfg.resultado)}">${etiquetaResultado(p.cfg.resultado)}${(p.cfg.golesF!==""&&p.cfg.golesC!=="")?` ${p.cfg.golesF}-${p.cfg.golesC}`:""}</span>
        </div>`;
      c4.appendChild(ev);
    });
    w.appendChild(c4);
  }
  return w;
}

  const b = document.createElement("button");
  b.className="full"; b.textContent="Crear asado";
  b.onclick = async ()=>{
    const fecha = document.getElementById("as-fecha").value;
    const lugar = document.getElementById("as-lugar").value.trim();
    if(!fecha){ alert("Elegí una fecha."); return; }
    data.asados.push({id:uid(), fecha, lugar, aportes:[]});
    await guardar(); render();
  };
  card.appendChild(b);
  w.appendChild(card);

  const lc = document.createElement("div");
  lc.className="card";
  lc.innerHTML = `<h2>Próximos asados</h2>`;
  const ord = data.asados.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(!ord.length) lc.innerHTML += `<p class="vacio">No hay asados.</p>`;
  ord.forEach(as=>{
    const ev = document.createElement("div");
    ev.className="evento";
    ev.innerHTML = `<div class="evento-cab">
        <div>
          <div class="evento-tit">🔥 ${fechaLinda(as.fecha)}</div>
          <div class="evento-meta">${as.lugar || "Lugar a confirmar"}</div>
        </div>
        <span class="pill">${as.aportes.length} aportes</span>
      </div>`;

    // Yo llevo: selector simple + campo libre
    const r = document.createElement("div");
    r.className="row";
    const sel = document.createElement("select");
    sel.innerHTML = `<option value="">Yo llevo...</option>` +
      APORTES.map(a=>`<option value="${a}">${a}</option>`).join("") +
      `<option value="__otro">Otra cosa...</option>`;
    r.appendChild(sel);
    const bAdd = document.createElement("button");
    bAdd.textContent="Sumar"; bAdd.style.flex="0 0 auto";
    r.appendChild(bAdd);
    ev.appendChild(r);

    const rOtro = document.createElement("div");
    rOtro.className="row"; rOtro.style.display="none";
    const inOtro = document.createElement("input");
    inOtro.type="text"; inOtro.placeholder="¿Qué llevás?"; inOtro.autocomplete="off";
    rOtro.appendChild(inOtro);
    ev.appendChild(rOtro);

    sel.onchange = ()=>{ rOtro.style.display = sel.value==="__otro" ? "flex" : "none"; };
    bAdd.onclick = async ()=>{
      let trae = sel.value;
      if(trae==="__otro") trae = inOtro.value.trim();
      if(!trae){ alert("Elegí o escribí qué llevás."); return; }
      as.aportes.push({jugadorId: miPerfil.id, trae});
      await guardar(); render();
    };

    const ul = document.createElement("ul");
    ul.className="lista";
    if(!as.aportes.length) ul.innerHTML = `<li class="vacio">Nadie anotó nada todavía.</li>`;
    as.aportes.forEach((ap,idx)=>{
      const li = document.createElement("li");
      li.className="item";
      li.innerHTML = `<div class="item-main"><span class="item-nom">${nombreDe(ap.jugadorId)}</span></div>
                      <span class="pill oro">${ap.trae}</span>`;
      // Cada uno borra lo suyo; el capitán puede borrar cualquiera
      if(ap.jugadorId===miPerfil.id || soyCapitan()){
        const x = document.createElement("button");
        x.className="ghost mini"; x.textContent="✕";
        x.onclick = async ()=>{ as.aportes.splice(idx,1); await guardar(); render(); };
        li.appendChild(x);
      }
      ul.appendChild(li);
    });
    ev.appendChild(ul);

    const bD = document.createElement("button");
    bD.className="danger mini"; bD.textContent="Borrar asado";
    bD.style.marginTop="10px";
    bD.onclick = async ()=>{
      if(!confirm("¿Borrar este asado?")) return;
      data.asados = data.asados.filter(x=>x.id!==as.id);
      await guardar(); render();
    };
    ev.appendChild(bD);
    lc.appendChild(ev);
  });
  w.appendChild(lc);
  return w;
}

arrancar();
</script>
</body>
</html>
